<style>
  /*
   * Mockup das seções Fundamentos e Comunicados da tela do ativo (T2 do plano M1.6c).
   * O desenho parte do aprovado no M1.6b (ativo.html, ativo-estados.html) e usa as classes
   * do kit. Dado real de PETR4 e ITUB4 (e de AZEV11 e IBOV em dois estados), pedido a
   * /api/v1/ pelo proxy do Vite; os outros estados, montados à mão com os campos reais de
   * backend/apps/api/serializers.py. Só var(--ruvor-*) e valores estruturais: nenhuma cor
   * literal.
   *
   * Estilo local:
   *   - fnd-: o que a T3 leva ao kit (a posição entre os pares, o filtro que quebra linha, a
   *     lista de comunicados e o link para fora);
   *   - mk-: a moldura do mockup, que não é tela.
   */

  /* --- fnd-: a posição entre os pares, ao pé do número ---------------------------------- */
  .fnd-peer { display: flex; flex-direction: column; gap: var(--ruvor-space-1); margin-top: var(--ruvor-space-2); padding-top: var(--ruvor-space-2); border-top: 1px dashed var(--ruvor-border); }
  .fnd-peer__label { font-family: var(--ruvor-font-mono); font-size: var(--ruvor-type-label-size); font-weight: var(--ruvor-type-label-weight); letter-spacing: var(--ruvor-type-label-tracking); text-transform: uppercase; color: var(--ruvor-text-muted); }
  .fnd-peer .ruvor-bar { width: 100%; max-width: 220px; }

  /* --- fnd-: o filtro de categoria, que quebra linha em 360 px -------------------------- */
  .fnd-filter { flex-wrap: wrap; }

  /* --- fnd-: a lista de comunicados ------------------------------------------------------ */
  .fnd-docs { list-style: none; margin: var(--ruvor-space-3) 0 0; padding: 0; }
  .fnd-doc { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: var(--ruvor-space-1) var(--ruvor-space-4); padding: var(--ruvor-space-3) 0; border-bottom: 1px solid var(--ruvor-table-rule); }
  .fnd-doc:last-child { border-bottom: 0; }
  .fnd-doc__date { color: var(--ruvor-text-muted); font-size: var(--ruvor-type-small-size); padding-top: 2px; }
  .fnd-doc__main { display: flex; flex-direction: column; align-items: flex-start; gap: var(--ruvor-space-1); min-width: 0; }
  .fnd-doc__link { color: var(--ruvor-ink); font-weight: var(--ruvor-type-small-weight); text-decoration: underline; text-decoration-color: var(--ruvor-border); text-underline-offset: 3px; overflow-wrap: anywhere; }
  .fnd-doc__link:hover { text-decoration-color: currentColor; }
  .fnd-doc__link:focus-visible { outline: 2px solid var(--ruvor-focus); outline-offset: 2px; border-radius: 2px; }
  .fnd-doc__link .ruvor-glyph { margin-left: var(--ruvor-space-1); color: var(--ruvor-text-muted); }
  .fnd-docs__foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruvor-space-2) var(--ruvor-space-4); margin-top: var(--ruvor-space-4); }
  .fnd-docs__head { flex-wrap: wrap; }

  @media (max-width: 720px) {
    .fnd-doc { grid-template-columns: minmax(0, 1fr); }
  }

  /* --- Moldura do mockup: não é tela ------------------------------------------------ */
  .mk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruvor-space-2) var(--ruvor-space-3); padding: var(--ruvor-space-2) var(--ruvor-space-5); background: var(--ruvor-surface-2); border-bottom: 1px dashed var(--ruvor-text-muted); }
  .mk-bar .ruvor-eyebrow { margin: 0; color: var(--ruvor-text-muted); }
  .mk-group { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruvor-space-1); }
  .mk-group > span { font-size: var(--ruvor-type-micro-size); color: var(--ruvor-text-muted); margin-right: var(--ruvor-space-1); }
  .mk-bar .ruvor-btn { padding: 4px 9px; font-size: var(--ruvor-type-micro-size); }
  .mk-bar .ruvor-btn[aria-pressed="true"] { border-color: var(--ruvor-ink); box-shadow: inset 0 0 0 1px var(--ruvor-ink); }
  .mk-cases { display: flex; flex-direction: column; gap: var(--ruvor-space-7); }
  .mk-case { display: flex; flex-direction: column; gap: var(--ruvor-space-4); min-width: 0; }
  .mk-case[hidden], .mk-view[hidden] { display: none; }
  .mk-case__head { display: flex; flex-direction: column; gap: var(--ruvor-space-1); padding: var(--ruvor-space-2) var(--ruvor-space-3); border: 1px dashed var(--ruvor-text-muted); border-radius: var(--ruvor-radius-sm); background: var(--ruvor-surface-2); color: var(--ruvor-text-muted); font-size: var(--ruvor-type-micro-size); }
  .mk-case__head b { color: var(--ruvor-ink); font-family: var(--ruvor-font-mono); }
  .mk-case__head p { margin: 0; }
  .mk-case__head summary { cursor: pointer; }
  .mk-json { margin: var(--ruvor-space-2) 0 0; max-height: 320px; overflow: auto; font-family: var(--ruvor-font-mono); font-size: var(--ruvor-type-micro-size); white-space: pre; color: var(--ruvor-text); }
  .mk-tail { margin: 0; padding: var(--ruvor-space-2) var(--ruvor-space-3); border: 1px dashed var(--ruvor-text-muted); border-radius: var(--ruvor-radius-sm); color: var(--ruvor-text-muted); font-size: var(--ruvor-type-micro-size); }
  .mk-textos { table-layout: fixed; }
  .mk-textos td { vertical-align: top; overflow-wrap: anywhere; font-size: var(--ruvor-type-small-size); }
  .mk-textos td:first-child { font-family: var(--ruvor-font-mono); font-size: var(--ruvor-type-micro-size); color: var(--ruvor-text-muted); width: 34%; }
  @media (max-width: 720px) {
    .mk-bar { padding-inline: var(--ruvor-space-4); }
    .mk-textos td:first-child { width: 40%; }
  }
</style>

<script type="module">
// ---------------------------------------------------------------- formatação (pt-BR), a do M1.6b
const NF = (o) => new Intl.NumberFormat("pt-BR", o);
const fLoss = NF({ style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fPct1 = NF({ style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fMoney = NF({ style: "currency", currency: "BRL" });
const fMoney0 = NF({ style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const fInt = NF({ maximumFractionDigits: 0 });
const fDec1 = NF({ minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fDec2 = NF({ minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fP = NF({ minimumFractionDigits: 3, maximumFractionDigits: 3 });
const fInstantF = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
const lossFromVar = (v) => 1 - Math.exp(-v);
// O menos tipográfico (U+2212) no lugar do hífen, como no M1.6b.
const minus = (s) => s.replace(/^-/, "−");
const fDate = (s) => { const [y, m, d] = s.split("-"); return `${d}/${m}/${y}`; };
const fInstant = (s) => fInstantF.format(new Date(s)).replace(",", " às");

// Os valores em reais abreviados (plano, "Os valores em reais"): abaixo de mil, inteiro; depois
// mil, mi, bi e tri com uma casa; negativo com o menos tipográfico. A forma inteira vai ao
// aria-label (fMoney).
const COMPACT = [[1e12, "tri"], [1e9, "bi"], [1e6, "mi"], [1e3, "mil"]];
function fCompact(value) {
  const v = Number(value), a = Math.abs(v), sign = v < 0 ? "−" : "";
  for (const [base, unit] of COMPACT) if (a >= base) return `${sign}R$ ${fDec1.format(a / base)} ${unit}`;
  return `${sign}${fMoney0.format(a)}`;
}
const fMoneyFull = (value) => minus(fMoney.format(Number(value)));

const T = (k, ...a) => {
  const v = k in TEXTOS ? TEXTOS[k] : HERDADOS[k];
  if (v === undefined) throw new Error(`texto sem chave: ${k}`);
  return typeof v === "function" ? v(...a) : v;
};

// ---------------------------------------------------------------- utilidades
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const glyph = (id, cls = "") => `<svg class="ruvor-glyph ${cls}" aria-hidden="true" focusable="false"><use href="#${id}"/></svg>`;
const why = (text) => `<p class="ruvor-note">${esc(text)}</p>`;
let uid = 0;
const nextId = (p) => `${p}-${++uid}`;

for (const n of document.querySelectorAll("[data-t]")) n.textContent = T(n.dataset.t);
for (const n of document.querySelectorAll("[data-t-aria]")) n.setAttribute("aria-label", T(n.dataset.tAria));
for (const n of document.querySelectorAll("[data-t-placeholder]")) n.setAttribute("placeholder", T(n.dataset.tPlaceholder));

const api = async (ticker, p) => {
  const r = await fetch(`/api/v1/assets/${ticker}${p}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
};

// Os painéis do M1.6b: estado, erro de seção, esqueleto.
function statePanel({ tone = "evidence", icon = "i-duo-info", title, text = "", actions = "", notice = false }) {
  const inner = `<span class="ruvor-icon ruvor-icon--${tone}"><svg aria-hidden="true" focusable="false"><use href="#${icon}"/></svg></span>
    <div class="ruvor-state__body">
      <p class="ruvor-state__title">${esc(title)}</p>
      ${text ? `<p class="ruvor-state__text">${esc(text)}</p>` : ""}
      ${actions ? `<div class="ruvor-state__actions">${actions}</div>` : ""}
    </div>`;
  return notice
    ? `<div class="ruvor-state ruvor-state--notice">${inner}</div>`
    : `<div class="ruvor-panel"><div class="ruvor-panel__body ruvor-state">${inner}</div></div>`;
}
const sectionError = (retry = "") => `<div class="ruvor-callout ruvor-callout--critical ruvor-callout--row" role="alert"><span>${esc(T("ativo.erroSecao"))}</span><button class="ruvor-btn" type="button" data-retry="${retry}">${glyph("i-arrows-clockwise")}<span>${esc(T("ativo.tentarDeNovo"))}</span></button></div>`;
const skeleton = (key, short = false) => `<div class="ruvor-skeleton ruvor-skeleton--block${short ? " ruvor-skeleton--short" : ""}" role="status" aria-busy="true"><span class="ruvor-sr-only">${esc(T(key))}</span></div>`;

// ================================================================ FUNDAMENTOS (RF-05 a RF-10)
// A atribuição dos nulos (plano, "A atribuição dos nulos"): cópia literal das regras de
// backend/apps/fundamentals/indicators.py (REASON_NULLS) e do "só general" do cálculo.
const REASON_NULLS = {
  unit: ["price_date", "close", "eps", "bvps", "pe", "pb"],
  stale_statement: ["price_date", "close", "eps", "bvps", "pe", "pb"],
  no_share_count: ["eps", "bvps", "pe", "pb"],
  share_scale_unknown: ["eps", "bvps", "pe", "pb"],
  no_price: ["price_date", "close", "pe", "pb"],
};
const PLAN_NULLS = ["revenue_ttm", "ebit_ttm", "net_margin", "ebit_margin", "gross_debt", "cash", "net_debt", "net_debt_to_equity"];
const MARKET_CAP_REASONS = ["stale_statement", "no_share_count", "share_scale_unknown", "ambiguous_class", "no_price", "missing_class_price"];

// A ordem das perguntas para um campo nulo: plano, motivo por ação, motivo da capitalização,
// genérica. Devolve a marca (data-null-reason) e a frase.
function nullReason(ind, field) {
  const plan = ind.account_plan;
  if (plan !== "general" && PLAN_NULLS.includes(field)) {
    if (plan === "bank" || plan === "insurance") return { code: `plan:${plan}`, text: T("fundamentos.nulo.planoFinanceiro") };
    if (plan === "unknown") return { code: "plan:unknown", text: T("fundamentos.nulo.planoDesconhecido") };
  }
  const r = ind.per_share_missing;
  if (r != null && REASON_NULLS[r]?.includes(field)) return { code: `per_share:${r}`, text: T(`fundamentos.nulo.porAcao.${r}`) };
  const m = ind.market_cap_missing;
  if (field === "market_cap" && m != null && MARKET_CAP_REASONS.includes(m)) return { code: `market_cap:${m}`, text: T(`fundamentos.nulo.valorMercado.${m}`) };
  return { code: "generic", text: T("fundamentos.nulo.generico") };
}

const KIND = {
  revenue_ttm: "money", ebit_ttm: "money", net_income_ttm: "money", equity_parent: "money", total_assets: "money",
  gross_debt: "money", cash: "money", net_debt: "money", market_cap: "money",
  net_margin: "ratio", ebit_margin: "ratio", roe: "ratio", net_debt_to_equity: "ratio",
  close: "perShare", eps: "perShare", bvps: "perShare", pe: "multiple", pb: "multiple",
};
const BLOCKS = [
  ["resultado", ["revenue_ttm", "ebit_ttm", "net_income_ttm"]],
  ["rentabilidade", ["net_margin", "ebit_margin", "roe"]],
  ["endividamento", ["gross_debt", "cash", "net_debt", "net_debt_to_equity"]],
  ["porAcao", ["close", "eps", "bvps", "pe", "pb"]],
  ["tamanho", ["equity_parent", "total_assets", "market_cap"]],
];
const PEER_FIELDS = ["roe", "net_margin", "ebit_margin", "net_debt_to_equity", "pe", "pb"];

function display(field, v) {
  const n = Number(v);
  switch (KIND[field]) {
    case "money": return { text: fCompact(n), aria: fMoneyFull(n) };
    case "ratio": return { text: minus(fPct1.format(n)) };
    case "perShare": return { text: fMoneyFull(n) };
    default: return { text: T("fundamentos.vezes", minus(fDec2.format(n))) };
  }
}
const per100 = (v) => fMoney.format(Math.abs(100 * Number(v)));

// A frase de um número presente. asset: a identidade (para o último pregão), ou null.
function phrase(field, ind, asset) {
  const v = Number(ind[field]), neg = v < 0;
  const shares = ind.shares_total == null ? "—" : fInt.format(ind.shares_total);
  const pd = ind.price_date ? fDate(ind.price_date) : "—";
  const close = ind.close == null ? "—" : fMoneyFull(ind.close);
  switch (field) {
    case "revenue_ttm": case "gross_debt": case "cash": case "total_assets": case "market_cap": return T(`fundamentos.${field}`);
    case "ebit_ttm": case "net_income_ttm": case "net_debt": case "equity_parent": return T(`fundamentos.${field}`, neg);
    case "net_margin": case "ebit_margin": case "roe": case "net_debt_to_equity": return T(`fundamentos.${field}`, per100(v), neg);
    case "close": {
      const last = asset && typeof asset === "object" ? asset.last_price?.date : null;
      return last && ind.price_date < last ? T("fundamentos.closeOutraData", pd, fDate(last)) : T("fundamentos.close", pd);
    }
    case "eps": return T("fundamentos.eps", shares, neg);
    case "bvps": return T("fundamentos.bvps", shares);
    case "pe": return T("fundamentos.pe", pd, close, minus(fDec1.format(v)), neg);
    case "pb": return T("fundamentos.pb", pd, close, fDec2.format(v));
  }
  return "";
}

function fmtMedian(field, m) {
  const n = Number(m);
  return KIND[field] === "ratio" ? minus(fPct1.format(n)) : T("fundamentos.vezes", minus(fDec2.format(n)));
}

// A posição entre os pares (RF-10): k = round(percentile × (n − 1)), só com n ≥ 3 e as três
// colunas presentes. A barra é a do kit, na cor neutra da evidência.
function peerSlot(field, peers) {
  const p = peers[field];
  const ok = p && p.median != null && p.percentile != null && p.count != null && p.count >= 3;
  const label = `<span class="fnd-peer__label">${esc(T("fundamentos.pares.rotulo"))}</span>`;
  if (!ok) return `<div class="fnd-peer">${label}${why(T("fundamentos.pares.semComparacao"))}</div>`;
  const n = p.count, pct = Number(p.percentile);
  const k = Math.round(pct * (n - 1));
  return `<div class="fnd-peer" data-peer-k="${k}" data-peer-n="${n - 1}">${label}
    <span class="ruvor-bar ruvor-bar--evidence" aria-hidden="true"><span class="ruvor-bar__fill" style="width: ${(100 * pct).toFixed(1)}%"></span></span>
    ${why(`${k === 0 ? T("fundamentos.pares.abaixoDeTodas", fInt.format(n - 1)) : T("fundamentos.pares.posicao", fInt.format(k), fInt.format(n - 1))} ${T("fundamentos.pares.mediana", fmtMedian(field, p.median))}`)}
  </div>`;
}

function stat(field, ind, peers, asset) {
  const v = ind[field];
  let value, note;
  if (v == null) {
    const r = nullReason(ind, field);
    value = `<span class="ruvor-stat__value ruvor-num" data-null-reason="${r.code}" aria-label="${esc(T("fundamentos.semValor"))}">—</span>`;
    note = r.text;
  } else {
    const d = display(field, v);
    value = `<span class="ruvor-stat__value ruvor-num"${d.aria ? ` aria-label="${esc(d.aria)}"` : ""}>${esc(d.text)}</span>`;
    note = phrase(field, ind, asset);
  }
  const peer = peers && PEER_FIELDS.includes(field) ? peerSlot(field, peers) : "";
  return `<div class="ruvor-stat" data-field="${field}"><span class="ruvor-stat__label">${esc(T(`fundamentos.rotulo.${field}`))}</span>${value}${why(note)}${peer}</div>`;
}

function peersNotice(peers) {
  if (peers == null) return statePanel({ notice: true, icon: "i-buildings", title: T("fundamentos.pares.indisponivel") });
  if (peers.peer_level === "segment") return statePanel({ notice: true, icon: "i-buildings", title: T("fundamentos.pares.segmento", peers.group_segment), text: T("fundamentos.pares.leitura") });
  if (peers.peer_level === "subsector") return statePanel({ notice: true, icon: "i-buildings", title: T("fundamentos.pares.subsetor", peers.group_subsector), text: T("fundamentos.pares.leitura") });
  return statePanel({ notice: true, icon: "i-buildings", title: T("fundamentos.pares.nenhum") });
}

// A seção inteira. body: o corpo de /fundamentals; asset: a identidade, "loading" ou "error";
// state: "loading" | "error" para forçar; only: os blocos a mostrar (os estados montados).
function fundamentalsSection({ body = null, asset = null, state = null, only = null }) {
  const hid = nextId("h-fnd");
  const ind = body?.indicator ?? null;
  let st = state, inner = "", tag = "";
  if (!st) st = ind ? "ready" : asset === "loading" ? "loading" : "empty";
  if (st === "loading") inner = skeleton("fundamentos.carregando");
  else if (st === "error") inner = sectionError("fundamentals");
  else if (st === "empty") {
    const text = asset && typeof asset === "object" && asset.kind === "index" ? T("fundamentos.naoCalculado.indice") : T("fundamentos.naoCalculado.nota");
    inner = statePanel({ title: T("fundamentos.naoCalculado.titulo"), text });
  } else {
    tag = `<span class="ruvor-tag ruvor-tag--evidence">${esc(T("fundamentos.proveniencia", fDate(ind.statement.reference_date), T(`fundamentos.fonte.${ind.statement.source}`), fInstant(ind.calculated_at)))}</span>`;
    const peers = body.peers;
    const blocks = BLOCKS.filter(([k]) => !only || only.includes(k)).map(([k, fields]) => {
      const note = TEXTOS[`fundamentos.nota.${k}`];
      // Por ação: o preço usado numa linha própria, acima dos quatro que dependem dele.
      const stats = k === "porAcao"
        ? `<div class="ruvor-stats">${stat("close", ind, peers, asset)}</div><div class="ruvor-divider" style="margin: var(--ruvor-space-4) 0"></div><div class="ruvor-stats">${fields.slice(1).map((f) => stat(f, ind, peers, asset)).join("")}</div>`
        : `<div class="ruvor-stats">${fields.map((f) => stat(f, ind, peers, asset)).join("")}</div>`;
      return `<section class="ruvor-panel"><div class="ruvor-panel__head"><h3 class="ruvor-h3">${esc(T(`fundamentos.bloco.${k}`))}</h3></div>
        <div class="ruvor-panel__body">${stats}
        ${note ? `<p class="ruvor-note ruvor-panel__note">${esc(note)}</p>` : ""}</div></section>`;
    }).join("");
    inner = `<div class="ruvor-stack">${peersNotice(peers)}${blocks}${why(T("fundamentos.fonteNota"))}</div>`;
  }
  return `<section class="ruvor-stack" data-section="fundamentals" data-state="${st}" aria-labelledby="${hid}">
    <div class="ruvor-section-head"><div><p class="ruvor-eyebrow">${esc(T("fundamentos.sobrancelha"))}</p><h2 class="ruvor-h2" id="${hid}">${esc(T("fundamentos.titulo"))}</h2></div>${tag}</div>
    <p class="ruvor-sub">${esc(T("fundamentos.intro"))}</p>
    <div aria-live="polite">${inner}</div>
  </section>`;
}

// ================================================================ COMUNICADOS (RF-11 a RF-14)
const CATEGORIES = ["fato_relevante", "comunicado", "aviso_acionistas"];
const catTag = (c) => `<span class="ruvor-tag ${c === "fato_relevante" ? "ruvor-tag--evidence" : "ruvor-tag--neutral"}">${esc(T(`comunicados.categoria.${c}`))}</span>`;

function docItem(d) {
  return `<li class="fnd-doc">
    <span class="fnd-doc__date ruvor-num"><span class="ruvor-sr-only">${esc(T("comunicados.entregueEm"))} </span>${esc(fDate(d.delivered_on))}</span>
    <div class="fnd-doc__main">
      ${catTag(d.category)}
      <a class="fnd-doc__link" href="${esc(d.link)}" target="_blank" rel="noopener noreferrer" data-disclosure-link>${esc(d.title)}${glyph("i-arrow-square-out", "ruvor-glyph--sm")}<span class="ruvor-sr-only"> (${esc(T("comunicados.linkSaida"))})</span></a>
      ${d.reference_date && d.reference_date !== d.delivered_on ? why(T("comunicados.referencia", fDate(d.reference_date))) : ""}
    </div>
  </li>`;
}

// m: { state: "loading"|"error"|"ready", identity: objeto|"loading"|"error", body, filter,
//      items, offset, listLoading, more: "idle"|"loading"|"error" }
function disclosuresSection(m) {
  const hid = nextId("h-com");
  let st, inner, company = null;
  if (m.state === "loading") { st = "loading"; inner = skeleton("comunicados.carregando"); }
  else if (m.state === "error") { st = "error"; inner = sectionError("disclosures"); }
  else if (m.body.company == null) {
    // company nulo: o caso sai do kind da identidade (RF-14)
    // A identidade ainda carrega ou falhou: não dá para dizer se é índice (data-company "unlinked").
    if (m.identity === "loading") { st = "loading"; company = "unlinked"; inner = skeleton("comunicados.carregando"); }
    else if (m.identity === "error") { st = "empty"; company = "unlinked"; inner = statePanel({ icon: "i-duo-info", title: T("comunicados.semLigacao") }); }
    else if (m.identity.kind === "index") { st = "empty"; company = "none-index"; inner = statePanel({ icon: "i-duo-info", title: T("comunicados.indice") }); }
    else { st = "empty"; company = "none-stock"; inner = statePanel({ icon: "i-duo-info", title: T("comunicados.semCodigo") }); }
  } else {
    company = m.body.company.code_cvm;
    if (m.body.count === 0 && m.filter === "" && !m.listLoading) {
      st = "empty";
      inner = statePanel({ icon: "i-file-text", title: T("comunicados.vazio") });
    } else {
      const who = m.body.company.name ? T("comunicados.companhia", m.body.company.name, m.body.company.code_cvm) : T("comunicados.companhiaSemNome", m.body.company.code_cvm);
      const filter = `<div class="ruvor-btn-group fnd-filter" role="group" aria-label="${esc(T("comunicados.filtro.rotulo"))}">
        ${["", ...CATEGORIES].map((c) => `<button class="ruvor-btn" type="button" data-filter="${c}" aria-pressed="${m.filter === c}">${esc(T(`comunicados.filtro.${c || "todas"}`))}</button>`).join("")}</div>`;
      let list;
      if (m.listLoading) { st = "loading"; list = `<div style="margin-top: var(--ruvor-space-3)">${skeleton("comunicados.carregando", true)}</div>`; }
      else if (m.items.length === 0) {
        st = "empty";
        list = `<div style="margin-top: var(--ruvor-space-3)">${statePanel({ notice: true, icon: "i-file-text", title: T("comunicados.filtroVazio", T(`comunicados.categoria.${m.filter}`)), actions: `<button class="ruvor-btn" type="button" data-filter="">${esc(T("comunicados.verTodas"))}</button>` })}</div>`;
      } else {
        st = "ready";
        const hasMore = m.offset + m.pageLength < m.body.count;
        const more = m.more === "loading"
          ? `<button class="ruvor-btn" type="button" aria-busy="true" disabled>${glyph("i-spinner-gap", "ruvor-spin")}<span>${esc(T("comunicados.carregandoMais"))}</span></button>`
          : m.more === "error"
            ? `<div class="ruvor-callout ruvor-callout--critical ruvor-callout--row" role="alert"><span>${esc(T("comunicados.erroMais"))}</span><button class="ruvor-btn" type="button" data-more>${glyph("i-arrows-clockwise")}<span>${esc(T("ativo.tentarDeNovo"))}</span></button></div>`
            : hasMore ? `<button class="ruvor-btn" type="button" data-more>${esc(T("comunicados.mostrarMais"))}</button>` : "";
        list = `<ul class="fnd-docs">${m.items.map(docItem).join("")}</ul>
          <div class="fnd-docs__foot"><span class="ruvor-muted" role="status">${esc(T("comunicados.mostrando", fInt.format(m.items.length), fInt.format(m.body.count)))}</span>${more}</div>`;
      }
      inner = `<div class="ruvor-panel">
        <div class="ruvor-panel__head fnd-docs__head">${filter}</div>
        <div class="ruvor-panel__body">${why(`${who} ${T("comunicados.saida")}`)}${list}</div>
      </div>`;
    }
  }
  return `<section class="ruvor-stack" data-section="disclosures" data-state="${st}"${company ? ` data-company="${esc(company)}"` : ""} aria-labelledby="${hid}">
    <div class="ruvor-section-head"><div><p class="ruvor-eyebrow">${esc(T("comunicados.sobrancelha"))}</p><h2 class="ruvor-h2" id="${hid}">${esc(T("comunicados.titulo"))}</h2></div></div>
    <p class="ruvor-sub">${esc(T("comunicados.intro"))}</p>
    <div aria-live="polite">${inner}</div>
  </section>`;
}

// A seção viva: o filtro volta a offset=0, "mostrar mais" soma sem repetir o link (D-131), e a
// resposta atrasada de um pedido anterior é descartada pelo número de sequência (M1.6b).
function mountDisclosures(host, ticker, identityP) {
  const m = { state: "loading", identity: "loading", body: null, filter: "", items: [], offset: 0, pageLength: 0, listLoading: false, more: "idle" };
  let seq = 0;
  const draw = () => { host.innerHTML = disclosuresSection(m); };
  identityP.then((a) => { m.identity = a; draw(); }, () => { m.identity = "error"; draw(); });
  async function page(reset) {
    const my = ++seq;
    const offset = reset ? 0 : m.offset + 10;
    if (reset) { if (m.body) m.listLoading = true; else m.state = "loading"; m.more = "idle"; } else m.more = "loading";
    draw();
    try {
      const b = await api(ticker, `/disclosures?limit=10&offset=${offset}&category=${m.filter}`);
      if (my !== seq) return; // descartada: outro pedido saiu depois
      m.body = b; m.state = "ready"; m.listLoading = false; m.more = "idle"; m.offset = offset; m.pageLength = b.results.length;
      if (reset) m.items = [...b.results];
      else { const seen = new Set(m.items.map((i) => i.link)); m.items.push(...b.results.filter((i) => !seen.has(i.link))); }
    } catch {
      if (my !== seq) return;
      if (reset) { m.state = "error"; m.listLoading = false; } else m.more = "error";
    }
    draw();
  }
  host.addEventListener("click", (e) => {
    const f = e.target.closest("[data-filter]");
    if (f) { m.filter = f.dataset.filter; page(true); return; }
    if (e.target.closest("[data-more]")) { page(false); return; }
    if (e.target.closest("[data-retry]")) page(true);
  });
  page(true);
}

// ================================================================ O FIM DO RISCO (M1.6b, aprovado)
const MODEL_ORDER = ["historical", "parametric", "monte_carlo", "garch_1_1", "egarch", "lstm", "gru", "garchnet", "caviar"];
const CATEGORY = { historical: "traditional", parametric: "traditional", monte_carlo: "traditional", garch_1_1: "garch", egarch: "garch", lstm: "ml", gru: "ml", garchnet: "ml", caviar: "ml" };
const verdictTag = (r) => (r == null || r.adequate == null
  ? `<span class="ruvor-tag ruvor-tag--neutral">${esc(T("risco.tag.naoJulgado"))}</span>`
  : r.adequate ? `<span class="ruvor-tag ruvor-tag--validated">${esc(T("risco.tag.adequado"))}</span>`
               : `<span class="ruvor-tag ruvor-tag--review">${esc(T("risco.tag.naoAdequado"))}</span>`);
function modelsTable(results) {
  const at = (m, a) => results.find((r) => r.model_name === m && r.alpha === a) ?? null;
  const all = results.filter((r) => r.var_latest != null).map((r) => lossFromVar(Number(r.var_latest)));
  const scale = Math.max(...all, 0) || 1;
  const cell = (r) => {
    if (r == null || r.var_latest == null) return `<td><div class="ruvor-cell-stack"><span class="ruvor-loss"><b class="ruvor-num">—</b></span>${verdictTag(r)}</div></td>`;
    const l = lossFromVar(Number(r.var_latest));
    return `<td><div class="ruvor-cell-stack"><span class="ruvor-loss"><b class="ruvor-num">${esc(fLoss.format(l))}</b></span><span class="ruvor-bar ruvor-bar--evidence" aria-hidden="true"><span class="ruvor-bar__fill" style="width: ${(100 * l / scale).toFixed(1)}%"></span></span>${verdictTag(r)}</div></td>`;
  };
  const rows = MODEL_ORDER.map((m) => `<tr data-model="${m}">
      <td><button class="ruvor-table__toggle" type="button" aria-expanded="false" aria-label="${esc(T("risco.tabela.abrir", T(`risco.modelo.${m}`)))}">${glyph("i-caret-right")}<span>${esc(T(`risco.modelo.${m}`))}</span></button><span class="ruvor-table__sub">${esc(T(`risco.categoria.${CATEGORY[m]}`))}</span></td>
      ${cell(at(m, "0.0500"))}${cell(at(m, "0.0100"))}
    </tr>`).join("");
  return `<section class="ruvor-panel">
    <div class="ruvor-panel__head">${glyph("i-scales")}<h3 class="ruvor-h3">${esc(T("risco.tabela.titulo"))}</h3></div>
    <div class="ruvor-panel__body">${why(T("risco.tabela.intro"))}</div>
    <table class="ruvor-table ruvor-table--models">
      <colgroup><col class="ruvor-table__col--lead"><col><col></colgroup>
      <thead><tr><th scope="col">${esc(T("risco.tabela.col.modelo"))}</th><th scope="col">${esc(T("risco.tabela.col.0.0500"))}</th><th scope="col">${esc(T("risco.tabela.col.0.0100"))}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </section>`;
}
function trail(l) {
  const status = l.status === "ok" ? T("risco.trilha.status.ok")
    : l.status === "partial" ? T("risco.trilha.status.partial", MODEL_ORDER.length - new Set(l.results.filter((r) => !r.error).map((r) => r.model_name)).size)
    : T("risco.trilha.status.failed");
  const item = (k, v) => `<div><dt>${esc(T(`risco.trilha.${k}`))}</dt><dd>${esc(v)}</dd></div>`;
  return `${why(T("risco.trilha"))}
    <dl class="ruvor-trail">
      ${item("asOf", fDate(l.as_of_date))}
      ${item("firstPrice", fDate(l.first_price_date))}
      ${item("priceCount", fInt.format(l.price_count))}
      ${item("train", T("risco.trilha.pregoes", fInt.format(l.train_count)))}
      ${item("test", T("risco.trilha.pregoes", fInt.format(l.test_count)))}
      ${item("window", T("risco.trilha.pregoes", fInt.format(l.train_window_days)))}
      ${item("calculatedAt", fInstant(l.calculated_at))}
      ${item("finishedAt", l.finished_at ? fInstant(l.finished_at) : "—")}
      ${item("engine", l.engine_version)}
      ${item("seed", String(l.seed))}
      ${item("priceRun", l.price_run ? T("risco.trilha.coleta", HERDADOS[`risco.trilha.fonte.${l.price_run.source}`] ?? l.price_run.source, fInstant(l.price_run.finished_at ?? l.price_run.started_at)) : "—")}
      ${item("status", status)}
    </dl>`;
}

// ================================================================ AS VISTAS COM DADO REAL
const identities = new Map();
const identity = (t) => { if (!identities.has(t)) identities.set(t, api(t, "")); return identities.get(t); };

async function mountReal(view, ticker) {
  const host = $(`.mk-view[data-view="${view}"]`);
  if (host.dataset.mounted) return;
  host.dataset.mounted = "1";
  host.innerHTML = `<main class="ruvor-content ruvor-stack ruvor-stack--loose">
      <section class="ruvor-stack" data-risk-state="E1">
        <p class="mk-tail">${esc(`Moldura: acima, a tela aprovada no M1.6b — cabeçalho, preço, proventos, comportamento e o começo do risco de ${ticker}. Daqui para baixo, o fim do risco (a tabela dos nove) e as duas seções novas.`)}</p>
        <div data-risk-tail>${skeleton("fundamentos.carregando")}</div>
      </section>
      <div data-fnd>${fundamentalsSection({ state: "loading" })}</div>
      <div data-com></div>
    </main>
    <aside class="ruvor-rail ruvor-rail--stack"><div class="ruvor-rail__inner"><p class="ruvor-eyebrow">${esc(T("risco.trilha.titulo"))}</p><div data-trail></div></div></aside>`;
  const idP = identity(ticker);
  mountDisclosures($("[data-com]", host), ticker, idP);
  const loadFnd = async () => {
    const fh = $("[data-fnd]", host);
    fh.innerHTML = fundamentalsSection({ state: "loading" });
    const [b, a] = await Promise.allSettled([api(ticker, "/fundamentals"), idP]);
    if (b.status === "rejected") { fh.innerHTML = fundamentalsSection({ state: "error" }); $("[data-retry]", fh).addEventListener("click", loadFnd); return; }
    fh.innerHTML = fundamentalsSection({ body: b.value, asset: a.status === "fulfilled" ? a.value : "error" });
  };
  loadFnd();
  try {
    const risk = await api(ticker, "/risk");
    $("[data-risk-tail]", host).innerHTML = modelsTable(risk.latest.results);
    $("[data-trail]", host).innerHTML = trail(risk.latest);
  } catch { $("[data-risk-tail]", host).innerHTML = sectionError(); }
}

// Os casos reais dentro dos estados: pedidos só quando a vista abre.
let liveDone = false;
function mountLiveCases() {
  if (liveDone) return;
  liveDone = true;
  for (const el of document.querySelectorAll("[data-live-fnd]")) {
    const t = el.dataset.liveFnd;
    Promise.allSettled([api(t, "/fundamentals"), identity(t)]).then(([b, a]) => {
      el.innerHTML = b.status === "rejected" ? fundamentalsSection({ state: "error" }) : fundamentalsSection({ body: b.value, asset: a.status === "fulfilled" ? a.value : "error" });
    });
  }
  for (const el of document.querySelectorAll("[data-live-com]")) mountDisclosures(el, el.dataset.liveCom, identity(el.dataset.liveCom));
}

// ---------------------------------------------------------------- tema e seletor
const root = document.documentElement;
const themeBtns = document.querySelectorAll("[data-set-theme]");
function setTheme(theme) {
  if (theme === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", theme);
  for (const b of themeBtns) b.setAttribute("aria-pressed", String(b.dataset.setTheme === theme));
}
for (const b of themeBtns) b.addEventListener("click", () => setTheme(b.dataset.setTheme));

const mkBtns = document.querySelectorAll("[data-mk]");
const REAL = { petr4: "PETR4", itub4: "ITUB4" };
function setView(view) {
  for (const b of mkBtns) b.setAttribute("aria-pressed", String(b.dataset.mk === view));
  for (const v of document.querySelectorAll(".mk-view")) v.hidden = REAL[view] ? v.dataset.view !== view : v.dataset.view !== "estados";
  if (REAL[view]) { mountReal(view, REAL[view]); return; }
  for (const c of casesHost.querySelectorAll(".mk-case")) c.hidden = !(view === "todos" ? c.dataset.view !== "textos" : c.dataset.view === view);
  if (view === "todos" || view === "sem-indicador" || view === "com-companhia") mountLiveCases();
}
for (const b of mkBtns) b.addEventListener("click", () => setView(b.dataset.mk));

// ?vista=…&tema=light|dark|system — para capturar cada vista direto.
const params = new URLSearchParams(location.search);
setTheme(params.get("tema") || "system");
setView(params.get("vista") || "petr4");
document.body.dataset.ready = "true";
