<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruvor — ITUB4 (mockup da tela do ativo, M1.6b)</title>
<link rel="stylesheet" href="../../../brand/ruvor/tokens.css">
<link rel="stylesheet" href="../../../brand/ruvor/components.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css">
<style>
  /*
   * Mockup da tela do ativo (T3 do plano M1.6b). Dado real do ITUB4, pedido a /api/v1/ pelo
   * proxy do Vite. Só var(--ruvor-*) e valores estruturais: nenhuma cor literal. O canvas do
   * uPlot recebe a cor lida dos tokens por getComputedStyle e é recriado na troca de tema.
   *
   * Os componentes e o arranjo que este mockup desenhou como estilo local (prefixo atv-) foram
   * levados a brand/ruvor/components.css pela T5, com o prefixo ruvor-; a tela usa as classes
   * do kit. O que fica aqui:
   *   - as três regras de cor fixa da folha do uPlot (RF-22), que no produto vão ao app.css;
   *   - a barra, a chave de tema e o rodapé PROVISÓRIOS desta página (atv-top, atv-search,
   *     atv-theme, atv-foot): o casco aprovado é o do busca.html (T2), e é ele que está no kit;
   *   - as notas do mockup (atv-notes), que não são tela;
   *   - o título (o código do ativo) no tamanho display também abaixo de 720 px: o kit o leva
   *     ao degrau h2, como o busca.html e o ativo-estados.html; aqui ele ficava em display.
   */

  /* --- As três regras de cor fixa da folha do uPlot, sobrepostas por token (RF-22) --- */
  .uplot .u-select { background: var(--ruvor-control-hover); }
  .uplot.u-hz .u-cursor-x, .uplot.u-vt .u-cursor-y { border-right-color: var(--ruvor-border); }
  .uplot.u-hz .u-cursor-y, .uplot.u-vt .u-cursor-x { border-bottom-color: var(--ruvor-border); }
  .uplot { font-family: var(--ruvor-font-sans); }

  /* --- Barra superior provisória: marca, busca, chave de tema --- */
  .atv-top { grid-template-columns: auto minmax(0, 440px) auto; justify-content: space-between; }
  .atv-search { position: relative; }
  .atv-search .ruvor-glyph { position: absolute; left: var(--ruvor-space-3); top: 50%; transform: translateY(-50%); color: var(--ruvor-text-muted); pointer-events: none; }
  .atv-search .ruvor-input { padding-left: calc(var(--ruvor-space-3) + 16px + var(--ruvor-space-2)); }
  .atv-theme { display: flex; gap: var(--ruvor-space-1); }
  .atv-theme .ruvor-btn { padding: 6px 10px; color: var(--ruvor-topbar-link); border-color: var(--ruvor-avatar); background: transparent; }
  .atv-theme .ruvor-btn:hover:not(:disabled) { background: var(--ruvor-avatar); color: var(--ruvor-topbar-text); }
  .atv-theme .ruvor-btn[aria-pressed="true"] { background: var(--ruvor-topbar-text); color: var(--ruvor-topbar); border-color: var(--ruvor-topbar-text); }

  /* --- Rodapé provisório --- */
  .atv-foot { max-width: 1440px; margin: auto; box-sizing: border-box; padding: var(--ruvor-space-5) 40px var(--ruvor-space-6); border-top: 1px solid var(--ruvor-border); background: var(--ruvor-paper); display: flex; flex-direction: column; gap: var(--ruvor-space-2); color: var(--ruvor-text-muted); font-size: var(--ruvor-type-micro-size); }
  .atv-foot p { margin: 0; max-width: 90ch; }
  .atv-foot__data { display: flex; flex-wrap: wrap; gap: var(--ruvor-space-1) var(--ruvor-space-4); }

  /* --- Notas do mockup (não fazem parte da tela) --- */
  .atv-notes-wrap { max-width: 1440px; margin: auto; box-sizing: border-box; padding: 0 40px var(--ruvor-space-6); }
  .atv-notes { border: 1px dashed var(--ruvor-border); border-radius: var(--ruvor-radius-md); padding: var(--ruvor-space-4); display: flex; flex-direction: column; gap: var(--ruvor-space-3); }
  .atv-notes ul { margin: 0; padding-left: var(--ruvor-space-4); display: flex; flex-direction: column; gap: var(--ruvor-space-2); }
  .atv-notes code { font-family: var(--ruvor-font-mono); font-size: var(--ruvor-type-micro-size); }

  @media (max-width: 1000px) {
    .atv-foot, .atv-notes-wrap { padding-inline: 28px; }
  }
  @media (max-width: 720px) {
    .atv-top { height: auto; grid-template-columns: auto auto; row-gap: var(--ruvor-space-3); padding: var(--ruvor-space-3) var(--ruvor-space-4); }
    .atv-top .atv-search { grid-column: 1 / -1; grid-row: 2; }
    .atv-foot, .atv-notes-wrap { padding-inline: var(--ruvor-space-4); }
    .ruvor-asset-head .ruvor-display { font-size: var(--ruvor-type-display-size); line-height: var(--ruvor-type-display-leading); letter-spacing: var(--ruvor-type-display-tracking); }
  }
</style>
</head>
<body class="ruvor-app">

<header class="ruvor-topbar atv-top">

  <div class="atv-search" role="search">

    <button class="ruvor-btn" type="button" data-set-theme="dark" aria-pressed="false" data-t="casco.tema.escuro"></button>
    <button class="ruvor-btn" type="button" data-set-theme="system" aria-pressed="true" data-t="casco.tema.sistema"></button>
  </div>
</header>

<div class="ruvor-workspace">
<main class="ruvor-content ruvor-stack ruvor-stack--loose">

  <!-- Camada 1: identidade e último fechamento (RF-07) -->
  <section class="ruvor-asset-head" id="sec-head" aria-busy="true">

  </section>

    </div>
    <div class="ruvor-panel__body" data-body aria-busy="true"><div class="ruvor-skeleton ruvor-skeleton--block" aria-hidden="true"></div></div>
  </section>

  <!-- Proventos e desdobramentos (RF-09) -->
  <section class="ruvor-panel" id="sec-events" aria-labelledby="h-events">
    <div class="ruvor-panel__head">
      <svg class="ruvor-glyph" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM72,48v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24V80H48V48ZM208,208H48V96H208V208Z"/></svg>
      <h2 class="ruvor-h3" id="h-events" data-t="ativo.eventos.titulo"></h2>
      <span class="ruvor-push ruvor-muted" data-periodo></span>
    </div>
    <div class="ruvor-panel__body" data-body aria-busy="true"><div class="ruvor-skeleton ruvor-skeleton--block ruvor-skeleton--short" aria-hidden="true"></div></div>
  </section>

  <!-- Camada 2: comportamento (RF-10, RF-11) -->
  <section class="ruvor-stack" id="sec-behavior" aria-labelledby="h-behavior">
    <div class="ruvor-section-head">
      <div>
        <p class="ruvor-eyebrow" data-t="comportamento.sobrancelha"></p>
        <h2 class="ruvor-h2" id="h-behavior" data-t="comportamento.titulo"></h2>
      </div>
      <span class="ruvor-tag ruvor-tag--evidence" data-asof hidden></span>
    </div>
    <p class="ruvor-sub" data-t="comportamento.intro"></p>
    <div data-body aria-busy="true"><div class="ruvor-skeleton ruvor-skeleton--block" aria-hidden="true"></div></div>
  </section>

  <!-- Camada 3: risco (RF-12 a RF-15) -->
  <section class="ruvor-stack" id="sec-risk" aria-labelledby="h-risk" data-risk-state="RISCO_CARREGANDO">
    <div class="ruvor-section-head">
      <div>
        <p class="ruvor-eyebrow" data-t="risco.sobrancelha"></p>
        <h2 class="ruvor-h2" id="h-risk" data-t="risco.titulo"></h2>
      </div>
    </div>
    <p class="ruvor-sub" data-t="risco.intro"></p>
    <div data-body aria-busy="true"><div class="ruvor-skeleton ruvor-skeleton--block" aria-hidden="true"></div></div>
  </section>

</main>

<!-- A trilha do cálculo (RF-16) -->
<aside class="ruvor-rail ruvor-rail--stack" id="sec-trail" aria-labelledby="h-trail">
  <div class="ruvor-rail__inner">
    <p class="ruvor-eyebrow" id="h-trail" data-t="risco.trilha.titulo"></p>
    <div data-body aria-busy="true"><div class="ruvor-skeleton ruvor-skeleton--block" aria-hidden="true"></div></div>
  </div>
</aside>
</div>

<!-- Rodapé (RF-04): a ressalva e a fonte são da T2 (busca.html); aqui, provisórias -->
<footer class="atv-foot" id="foot">
  <p data-t="rodape.ressalva"></p>
  <div class="atv-foot__data">
    <span data-t="rodape.fonte"></span>
    <span data-foot-asof></span>
    <span data-foot-calc></span>
  </div>
</footer>

<div class="atv-notes-wrap">
  <!-- Nota do mockup: fora da tela. Mostra, para o portão, as formas das frases que o dado
       real do ITUB4 não exercita. -->
  <aside class="atv-notes" id="mock-notes" aria-labelledby="h-notes">
    <p class="ruvor-eyebrow" id="h-notes">Nota do mockup · não faz parte da tela</p>
    <p class="ruvor-muted">O dado do ITUB4 exercita um ramo de cada frase. As outras formas, que o portão também aprova, são estas (os valores são de exemplo):</p>
    <ul id="mock-variants"></ul>
  </aside>
</div>

const NF = (o) => new Intl.NumberFormat("pt-BR", o);
const fLoss = NF({ style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fPct1 = NF({ style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fPctS = NF({ style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1, signDisplay: "exceptZero" });
const fPct0S = NF({ style: "percent", maximumFractionDigits: 0, signDisplay: "exceptZero" });
const fMoney = NF({ style: "currency", currency: "BRL" });
const fMoneyEv = NF({ style: "currency", currency: "BRL", minimumFractionDigits: 2, maximumFractionDigits: 6 });

// A conversão do VaR (RF-12): a magnitude do retorno logarítmico vira perda em percentual simples.
const lossFromVar = (v) => 1 - Math.exp(-v);
const loss = (dec) => fLoss.format(lossFromVar(Number(dec)));
const minus = (s) => s.replace(/^-/, "−");

const api = async (p) => {
  const r = await fetch(`/api/v1/assets/${TICKER}${p}`);

function sectionError(host, retry) {
  host.removeAttribute("aria-busy");
  host.innerHTML = `<div class="ruvor-callout ruvor-callout--critical ruvor-callout--row" role="alert"><span>${esc(T("ativo.erroSecao"))}</span><button class="ruvor-btn" type="button">${glyph("retry")}<span>${esc(T("ativo.tentarDeNovo"))}</span></button></div>`;
  $("button", host).addEventListener("click", retry);
}

// ---------------------------------------------------------------- preço (RF-08)
async function loadPrice() {
  const sec = $("#sec-price"), host = $("[data-body]", sec);
  let p;
  try { p = await api("/prices"); } catch { sectionError(host, loadPrice); return; }
  const rows = p.results;
  const xs = rows.map((r) => Date.parse(`${r.date}T00:00:00Z`) / 1000);
  const ys = rows.map((r) => Number(r.adj_close));
  let iMin = 0, iMax = 0;
  ys.forEach((v, i) => { if (v < ys[iMin]) iMin = i; if (v > ys[iMax]) iMax = i; });
  const last = rows.length - 1;
  const resumo = T("grafico.resumoPreco", fDate(rows[0].date), fDate(rows[last].date),
    fMoney.format(ys[iMin]), fDate(rows[iMin].date), fMoney.format(ys[iMax]), fDate(rows[iMax].date), fMoney.format(ys[last]));
  host.removeAttribute("aria-busy");
  host.innerHTML = `
    ${why(T("ativo.precoAjustado"))}
    <div class="ruvor-chart__bar" style="margin-top: var(--ruvor-space-3)">
      <div class="ruvor-btn-group" role="group" aria-label="${esc(T("grafico.atalhos"))}">
        <button class="ruvor-btn" type="button" data-range="1" aria-pressed="false">${esc(T("grafico.atalho.1a"))}</button>
        <button class="ruvor-btn" type="button" data-range="5" aria-pressed="false">${esc(T("grafico.atalho.5a"))}</button>
        <button class="ruvor-btn" type="button" data-range="all" aria-pressed="true">${esc(T("grafico.atalho.tudo"))}</button>
      </div>
      <span class="ruvor-chart__readout ruvor-num" data-readout aria-hidden="true"></span>
    </div>
    <div class="ruvor-chart" id="chart-price" role="img" aria-describedby="resumo-preco"></div>
    <p class="ruvor-note ruvor-chart__summary" id="resumo-preco">${esc(resumo)}</p>
    ${why(T("grafico.arrasto"))}`;

  let range = "all";
  const readout = $("[data-readout]", host);
  const showRead = (i) => { readout.textContent = T("grafico.dicaPreco", fDate(rows[i].date), fMoney.format(ys[i])); };
  const applyRange = (u) => {
    if (range === "all") u.setScale("x", { min: xs[0], max: xs[last] });
    else u.setScale("x", { min: xs[last] - Number(range) * 365.25 * 86400, max: xs[last] });
  };
  const setPressed = () => { for (const b of host.querySelectorAll("[data-range]")) b.setAttribute("aria-pressed", String(b.dataset.range === range)); };
  let u = null;
  const make = () => {
    const box = $("#chart-price");
    u?.destroy(); box.replaceChildren();
    const c = colors();
    u = new uPlot({
      width: box.clientWidth, height: 260,
      legend: { show: false },
      tzDate: (ts) => uPlot.tzDate(new Date(ts * 1e3), "Etc/UTC"),
      cursor: { points: { stroke: c.ink, fill: c.surface, size: 8 }, drag: { x: true, y: false } },
      scales: { x: { time: true } },
      axes: [
        axis(c, { values: (self, splits) => {
          const span = (self.scales.x.max - self.scales.x.min) / 86400;
          return splits.map((s) => { const d = new Date(s * 1e3); return span > 3 * 365 ? String(d.getUTCFullYear()) : `${String(d.getUTCMonth() + 1).padStart(2, "0")}/${d.getUTCFullYear()}`; });
        } }),
        axis(c, { size: 64, values: (self, splits) => splits.map((v) => fMoney0.format(v)) }),
      ],
      series: [{}, { stroke: c.evidence, fill: undefined, width: 1.5, points: { stroke: c.evidence, fill: c.surface } }],
      hooks: {
        setCursor: [(self) => showRead(self.cursor.idx ?? last)],
        setSelect: [() => { range = "custom"; setPressed(); }],
      },
    }, [xs, ys], box);
    if (range !== "custom") applyRange(u);
    showRead(last);
  };
  for (const b of host.querySelectorAll("[data-range]")) {
    b.addEventListener("click", () => { range = b.dataset.range; setPressed(); applyRange(u); });
  }
  $("#chart-price").addEventListener("dblclick", () => { range = "all"; setPressed(); });
  charts.set("price", make);
  make();
  new ResizeObserver(() => u && u.setSize({ width: $("#chart-price").clientWidth, height: 260 })).observe($("#chart-price"));
}

// ---------------------------------------------------------------- proventos (RF-09)
async function loadEvents() {
  const sec = $("#sec-events"), host = $("[data-body]", sec);
  let ev, asset;
  try { [ev, asset] = await Promise.all([api("/events"), api("")]); } catch { sectionError(host, loadEvents); return; }
  const ref = asset.last_price?.date ?? new Date().toISOString().slice(0, 10);
  const [y, m, d] = ref.split("-");
  const start = `${Number(y) - 1}-${m}-${d}`;
  const all = [...ev.results].sort((a, b) => b.date.localeCompare(a.date));
  const recent = all.filter((e) => e.date > start && e.date <= ref);
  $("[data-periodo]", sec).textContent = T("ativo.eventos.periodo", fDate(ref));
  host.removeAttribute("aria-busy");
  const row = (e) => `<tr><td class="ruvor-num">${fDate(e.date)}</td><td>${esc(T(`ativo.eventos.${e.kind}`))}</td><td class="ruvor-num">${esc(e.kind === "dividend"
    ? T("ativo.eventos.valor", fMoneyEv.format(Number(e.amount)))
    : T("ativo.eventos.proporcao", fRatio(e.numerator), fRatio(e.denominator)))}</td></tr>`;
  let showAll = false;
  const render = () => {
    const list = showAll ? all : recent;
    host.innerHTML = (list.length === 0
      ? `<p class="ruvor-muted">${esc(T("ativo.eventos.nenhum"))}</p>`
      : `<table class="ruvor-table ruvor-table--end"><thead><tr><th scope="col">${esc(T("ativo.eventos.col.data"))}</th><th scope="col">${esc(T("ativo.eventos.col.tipo"))}</th><th scope="col">${esc(T("ativo.eventos.col.valor"))}</th></tr></thead><tbody>${list.map(row).join("")}</tbody></table>`)
      + (all.length > recent.length ? `<p style="margin: var(--ruvor-space-3) 0 0"><button class="ruvor-btn ruvor-btn--ghost" type="button" aria-expanded="${showAll}">${esc(showAll ? T("ativo.eventos.verMenos") : T("ativo.eventos.verTodos", fInt.format(all.length)))}</button></p>` : "");
    $("button", host)?.addEventListener("click", () => { showAll = !showAll; render(); });
  };
  render();
}

const RETURN_MONTHS = { return_1m: 1, return_3m: 3, return_6m: 6, return_12m: 12, return_36m: 36, return_60m: 60, return_120m: 120 };
function stat(key, value, phrase) {

}
function block(titleKey, inner, note, wide = false) {

}
async function loadBehavior() {
  const sec = $("#sec-behavior"), host = $("[data-body]", sec);
  let met;
  try { met = await api("/metrics"); } catch { sectionError(host, loadBehavior); return; }

  asof.hidden = false; asof.textContent = T("comportamento.ate", fDate(m.as_of_date));
  const N = (k) => (m[k] == null ? null : Number(m[k]));
  const x100 = (r) => fMoney.format(100 * (1 + r));

  const rets = Object.entries(RETURN_MONTHS).concat([["return_ytd", null]]).map(([k, months]) => {
    const r = N(k);
    if (r == null) return stat(k, "—", months ? T("comportamento.nulo.janela", months) : "");
    return stat(k, minus(fPctS.format(r)), T(`comportamento.${k}`, x100(r)));

  const vols = ["volatility_12m", "volatility_60m"].map((k) => {
    const v = N(k);
    return v == null ? stat(k, "—", T("comportamento.nulo.janela", k === "volatility_12m" ? 12 : 60)) : stat(k, fPct1.format(v), T(`comportamento.${k}`, fPct1.format(v)));
  }).join("");

  const dd = N("max_drawdown");
  const rs = m.max_drawdown_recovery_sessions;
  const drawdown = stat("max_drawdown", minus(fPct1.format(dd)), T("comportamento.max_drawdown", fPct1.format(Math.abs(dd)), fDate(m.max_drawdown_peak_date), fDate(m.max_drawdown_trough_date), fDate(m.first_price_date), m.max_drawdown_recovery_date ? fDate(m.max_drawdown_recovery_date) : null))
    + (rs == null ? stat("max_drawdown_recovery_sessions", "—", T("comportamento.nulo.naoRecuperou"))
                  : stat("max_drawdown_recovery_sessions", fInt.format(rs), T("comportamento.max_drawdown_recovery_sessions", fDec1.format(rs / 252))));

  const b = N("beta_60m"), c = N("correlation_60m");
  const isIndex = TICKER === "IBOV";
  const ibov = (b == null ? stat("beta_60m", "—", isIndex ? T("comportamento.nulo.referencia") : T("comportamento.nulo.janela", 60))
                          : stat("beta_60m", minus(fDec2.format(b)), T("comportamento.beta_60m", `${fDec2.format(Math.abs(b))}%`, b < 0)))
    + (c == null ? stat("correlation_60m", "—", isIndex ? T("comportamento.nulo.referencia") : T("comportamento.nulo.janela", 60))
                 : stat("correlation_60m", minus(fDec2.format(c)), T("comportamento.correlation_60m", minus(fDec2.format(c)))));

  const sk = N("skewness"), ku = N("excess_kurtosis");
  const moments = (sk == null ? stat("skewness", "—", T("comportamento.nulo.janela", 60)) : stat("skewness", minus(fDec2.format(sk)), T("comportamento.skewness", minus(fDec2.format(sk)), Math.sign(sk))))
    + (ku == null ? stat("excess_kurtosis", "—", T("comportamento.nulo.janela", 60)) : stat("excess_kurtosis", minus(fDec2.format(ku)), T("comportamento.excess_kurtosis", minus(fDec2.format(ku)), Math.sign(ku))));

  const dy = N("dividend_yield_12m");
  const divs = stat("dividends_12m", fMoney.format(N("dividends_12m")), T("comportamento.dividends_12m"))
    + stat("dividend_payments_12m", fInt.format(m.dividend_payments_12m), T("comportamento.dividend_payments_12m"))
    + stat("dividend_yield_12m", fPct1.format(dy), T("comportamento.dividend_yield_12m", fDate(m.as_of_date), fMoney.format(100 * dy)));

  const vol = ["avg_volume_21d", "avg_volume_252d"].map((k) => {
    const v = N(k);
    return v == null ? stat(k, "—", T("comportamento.nulo.pregoes", k === "avg_volume_21d" ? 21 : 252)) : stat(k, T("comportamento.unidade.volume", fDec1.format(v / 1e6)), T(`comportamento.${k}`));
  }).join("");

  const hist = m.statistical_observations == null
    ? `<p class="ruvor-muted">${esc(T("comportamento.histogramaCurto"))}</p>`
    : `${why(T("comportamento.histograma"))}

         <div class="ruvor-legend" aria-hidden="true"><span><i class="ruvor-legend__swatch ruvor-legend__swatch--critical"></i>${esc(T("grafico.legendaQueda"))}</span><span><i class="ruvor-legend__swatch ruvor-legend__swatch--evidence"></i>${esc(T("grafico.legendaAlta"))}</span></div>
       </div>
       <div class="ruvor-chart" id="chart-hist" role="img" aria-describedby="resumo-hist"></div>
       <div class="ruvor-chart__ends" aria-hidden="true"><span>← ${esc(T("grafico.pontaInferior"))}</span><span>${esc(T("grafico.pontaSuperior"))} →</span></div>
       <p class="ruvor-note ruvor-chart__summary" id="resumo-hist"></p>
       <div class="ruvor-stats" style="margin-top: var(--ruvor-space-5)">${moments}</div>`;

  host.removeAttribute("aria-busy");
  host.innerHTML = `<div class="ruvor-blocks">

    ${block("comportamento.bloco.volatilidade", `<div class="ruvor-stats">${vols}</div>`)}
    ${block("comportamento.bloco.queda", `<div class="ruvor-stats">${drawdown}</div>`)}
    ${block("comportamento.bloco.ibov", `<div class="ruvor-stats">${ibov}</div>`, m.benchmark_observations == null ? null : T("comportamento.nota.ibov", fInt.format(m.benchmark_observations)))}
    ${block("comportamento.bloco.proventos", `<div class="ruvor-stats">${divs}</div>`)}
    ${block("comportamento.bloco.distribuicao", hist, m.statistical_observations == null ? null : T("comportamento.nota.distribuicao", fInt.format(m.statistical_observations)), true)}
    ${block("comportamento.bloco.volume", `<div class="ruvor-stats">${vol}</div>`, null, true)}
  </div>`;
  if (m.statistical_observations != null) drawHistogram(m.histogram);
}

function binRange(b) {
  const lo = b.lower_bound == null ? null : Number(b.lower_bound);
  const hi = b.upper_bound == null ? null : Number(b.upper_bound);
  if (lo == null) return T("grafico.pontaInferior");
  if (hi == null) return T("grafico.pontaSuperior");
  return T("grafico.faixa", minus(fPct1.format(lo)), minus(fPct1.format(hi)));
}
function drawHistogram(bins) {
  const xs = bins.map((b) => b.bin_index);
  const isNeg = (b) => b.upper_bound != null && Number(b.upper_bound) <= 0;
  const neg = bins.map((b) => (isNeg(b) ? b.count : null));
  const pos = bins.map((b) => (isNeg(b) ? null : b.count));
  let top = bins[0];
  for (const b of bins) if (b.count > top.count) top = b;
  $("#resumo-hist").textContent = T("grafico.resumoHistograma", binRange(top), fInt.format(top.count), bins[0].count, bins[bins.length - 1].count);
  const TICKS = [0.5, 10.5, 20.5, 30.5, 40.5];
  const TICK_V = [-0.1, -0.05, 0, 0.05, 0.1];
  let u = null;
  const make = () => {
    const box = $("#chart-hist");
    u?.destroy(); box.replaceChildren();
    const c = colors();
    const bars = uPlot.paths.bars({ size: [0.86, Infinity], gap: 1 });
    const tip = document.createElement("div");
    tip.className = "ruvor-chart__tip"; tip.hidden = true; tip.setAttribute("aria-hidden", "true");
    u = new uPlot({
      width: box.clientWidth, height: 220,
      legend: { show: false },
      cursor: { points: { stroke: c.ink, fill: c.surface, size: 7 }, drag: { x: false, y: false } },
      scales: { x: { time: false, range: [-0.5, bins.length - 0.5] }, y: { range: (self, mn, mx) => [0, mx * 1.08] } },
      axes: [
        axis(c, { splits: () => TICKS, values: () => TICK_V.map((v) => minus(fPct0S.format(v))) }),
        axis(c, { size: 48, values: (self, splits) => splits.map((v) => fInt.format(v)) }),
      ],
      series: [{},
        { stroke: c.critical, fill: c.critical, paths: bars, points: { show: false, stroke: c.critical, fill: c.surface } },
        { stroke: c.evidence, fill: c.evidence, paths: bars, points: { show: false, stroke: c.evidence, fill: c.surface } }],
      hooks: {
        setCursor: [(self) => {
          const i = self.cursor.idx;
          if (i == null || self.cursor.left < 0) { tip.hidden = true; return; }
          tip.textContent = T("grafico.dicaBarra", binRange(bins[i]), bins[i].count);
          tip.style.left = `${self.valToPos(i, "x")}px`;
          tip.style.top = `${self.valToPos(bins[i].count, "y")}px`;
          tip.hidden = false;
        }],
      },
    }, [xs, neg, pos], box);
    u.over.appendChild(tip);
  };
  charts.set("hist", make);
  make();
  new ResizeObserver(() => u && u.setSize({ width: $("#chart-hist").clientWidth, height: 220 })).observe($("#chart-hist"));
}

// ---------------------------------------------------------------- risco (RF-12 a RF-16)
const MODEL_ORDER = ["historical", "parametric", "monte_carlo", "garch_1_1", "egarch", "lstm", "gru", "garchnet", "caviar"];
const CATEGORY = { historical: "traditional", parametric: "traditional", monte_carlo: "traditional", garch_1_1: "garch", egarch: "garch", lstm: "ml", gru: "ml", garchnet: "ml", caviar: "ml" };
const ALPHAS = ["0.0500", "0.0100"];

function discordancia(results, alpha) {
  const v = results.filter((r) => r.alpha === alpha && r.var_latest != null).map((r) => lossFromVar(Number(r.var_latest)));
  if (v.length === 0) return null;
  return { min: Math.min(...v), max: Math.max(...v), n: v.length, total: MODEL_ORDER.length };
}
function naoRejeitados(results, alpha) {
  const at = results.filter((r) => r.alpha === alpha);
  return {
    adequados: MODEL_ORDER.filter((m) => at.some((r) => r.model_name === m && r.adequate === true)),
    julgados: at.filter((r) => r.adequate !== null).length,
  };
}
const verdictTag = (r) => (r == null || r.adequate == null
  ? `<span class="ruvor-tag ruvor-tag--neutral">${esc(T("risco.tag.naoJulgado"))}</span>`
  : r.adequate ? `<span class="ruvor-tag ruvor-tag--validated">${esc(T("risco.tag.adequado"))}</span>`
               : `<span class="ruvor-tag ruvor-tag--review">${esc(T("risco.tag.naoAdequado"))}</span>`);
const passTag = (ok) => `<span class="ruvor-tag ${ok ? "ruvor-tag--validated" : "ruvor-tag--review"}">${esc(ok ? T("risco.teste.passou") : T("risco.teste.naoPassou"))}</span>`;

function levelPanel(results, alpha) {
  const d = discordancia(results, alpha);
  const nr = naoRejeitados(results, alpha);
  const cadaN = NIVEL_N[alpha];
  const range = d == null ? "—" : d.n === 1 ? fLoss.format(d.min) : T("risco.faixa", fLoss.format(d.min), fLoss.format(d.max));
  const perda = alpha === "0.0500" ? T("risco.perda95") : T("risco.perda99");
  const disc = T("risco.discordancia", d && fLoss.format(d.min), d && fLoss.format(d.max), d?.n ?? 0, MODEL_ORDER.length, cadaN, d && fLoss.format(d.min));
  const list = nr.adequados.map((m) => `<li><span class="ruvor-tag ruvor-tag--validated">${glyph("check", "ruvor-glyph--sm")}${esc(T(`risco.modelo.${m}`))}</span></li>`).join("");
  return `<article class="ruvor-panel"><div class="ruvor-panel__body ruvor-level">
    <p class="ruvor-eyebrow">${esc(T(`risco.nivel.${alpha}`))}</p>
    <p class="ruvor-range"><b class="ruvor-num">${esc(range)}</b><small>${esc(T("risco.horizonte"))}</small></p>
    ${why(perda)}
    ${why(disc)}
    <div class="ruvor-divider"></div>
    <p class="ruvor-level__title">${esc(T("risco.naoRejeitados.titulo"))}</p>
    ${list ? `<ul class="ruvor-tag-list">${list}</ul>` : ""}
    ${why(T("risco.naoRejeitados", nr.adequados.length, nr.julgados, MODEL_ORDER.length))}
  </div></article>`;
}

function testsFor(r, alpha, testCount) {
  const cadaN = NIVEL_N[alpha];
  if (r == null || r.error) {
    return `<div><p class="ruvor-eyebrow">${esc(T(`risco.nivel.${alpha}`))}</p>${why(T("risco.erroModelo", r?.error || "—"))}</div>`;
  }
  const e = fDec1.format(Number(r.expected_violations));
  const t = (key, p, ok) => `<div class="ruvor-test"><dt>${esc(T(`risco.rotulo.${key}`))}</dt><dd><span class="ruvor-num">${esc(fPval(p))}</span>${passTag(ok)}</dd>${why(T(`risco.${key}`, fPval(p), ok))}</div>`;
  return `<div>
    <p class="ruvor-eyebrow">${esc(T(`risco.nivel.${alpha}`))}</p>
    <dl class="ruvor-tests">
      <div class="ruvor-test"><dt>${esc(T("risco.rotulo.violacoes"))}</dt><dd class="ruvor-num">${fInt.format(r.violations)} × ${esc(e)}</dd>${why(T("risco.violacoes", fInt.format(r.violations), e, cadaN, r.kupiec_passed))}</div>
      ${t("kupiec", r.kupiec_p_value, r.kupiec_passed)}
      ${t("christoffersen", r.christoffersen_p_value, r.christoffersen_passed)}
      ${t("dq", r.dq_p_value, r.dq_passed)}
    </dl>
  </div>`;
}

function modelsTable(results, testCount) {
  const at = (m, a) => results.find((r) => r.model_name === m && r.alpha === a) ?? null;
  const all = results.filter((r) => r.var_latest != null).map((r) => lossFromVar(Number(r.var_latest)));
  const scale = Math.max(...all, 0) || 1; // a mesma escala nas dezoito células
  const cell = (r) => {
    if (r == null || r.var_latest == null) return `<td><div class="ruvor-cell-stack"><span class="ruvor-loss"><b class="ruvor-num">—</b></span>${verdictTag(r)}</div></td>`;
    const l = lossFromVar(Number(r.var_latest));
    return `<td><div class="ruvor-cell-stack">
      <span class="ruvor-loss"><b class="ruvor-num">${esc(fLoss.format(l))}</b></span>
      <span class="ruvor-bar ruvor-bar--evidence" aria-hidden="true"><span class="ruvor-bar__fill" style="width: ${(100 * l / scale).toFixed(1)}%"></span></span>
      ${verdictTag(r)}</div></td>`;
  };
  const rows = MODEL_ORDER.map((m, i) => {
    const cat = CATEGORY[m];
    const open = i === 0; // uma linha aberta no mockup
    return `<tr class="ruvor-table__row--expandable" data-model="${m}">
      <td><button class="ruvor-table__toggle" type="button" aria-expanded="${open}" aria-controls="det-${m}" aria-label="${esc(T("risco.tabela.abrir", T(`risco.modelo.${m}`)))}">${glyph("caret")}<span>${esc(T(`risco.modelo.${m}`))}</span></button><span class="ruvor-table__sub">${esc(T(`risco.categoria.${cat}`))}</span></td>
      ${cell(at(m, "0.0500"))}${cell(at(m, "0.0100"))}
    </tr>
    <tr class="ruvor-table__detail" id="det-${m}"${open ? "" : " hidden"}><td colspan="3"><div class="ruvor-table__detail-grid">${testsFor(at(m, "0.0500"), "0.0500", testCount)}${testsFor(at(m, "0.0100"), "0.0100", testCount)}</div></td></tr>`;
  }).join("");
  return `<section class="ruvor-panel" aria-labelledby="h-models">
    <div class="ruvor-panel__head">${glyph("scales")}<h3 class="ruvor-h3" id="h-models">${esc(T("risco.tabela.titulo"))}</h3></div>
    <div class="ruvor-panel__body">
      ${why(T("risco.tabela.intro"))}
      <div class="ruvor-legend" style="margin: var(--ruvor-space-3) 0 var(--ruvor-space-2); align-items: center">${verdictTag({ adequate: true })}${verdictTag({ adequate: false })}${verdictTag(null)}</div>
      ${why(T("risco.veredito"))}
    </div>
    <table class="ruvor-table ruvor-table--models">
      <colgroup><col class="ruvor-table__col--lead"><col><col></colgroup>
      <thead><tr><th scope="col">${esc(T("risco.tabela.col.modelo"))}</th><th scope="col">${esc(T("risco.tabela.col.0.0500"))}</th><th scope="col">${esc(T("risco.tabela.col.0.0100"))}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </section>`;
}

function trail(l) {
  const status = l.status === "ok" ? T("risco.trilha.status.ok")
    : l.status === "partial" ? T("risco.trilha.status.partial", MODEL_ORDER.length - new Set(l.results.filter((r) => !r.error).map((r) => r.model_name)).size)
    : T("risco.trilha.status.failed");
  const item = (k, v) => `<div><dt>${esc(T(`risco.trilha.${k}`))}</dt><dd>${esc(v)}</dd></div>`;
  return `${why(T("risco.trilha"))}
    <dl class="ruvor-trail">
      ${item("asOf", fDate(l.as_of_date))}
      ${item("firstPrice", fDate(l.first_price_date))}
      ${item("priceCount", fInt.format(l.price_count))}
      ${item("train", T("risco.trilha.pregoes", fInt.format(l.train_count)))}
      ${item("test", T("risco.trilha.pregoes", fInt.format(l.test_count)))}
      ${item("window", T("risco.trilha.pregoes", fInt.format(l.train_window_days)))}
      ${item("calculatedAt", fInstant(l.calculated_at))}
      ${item("finishedAt", l.finished_at ? fInstant(l.finished_at) : "—")}
      ${item("engine", l.engine_version)}
      ${item("seed", String(l.seed))}
      ${item("priceRun", l.price_run ? T("risco.trilha.coleta", TEXTOS[`risco.trilha.fonte.${l.price_run.source}`] ?? l.price_run.source, fInstant(l.price_run.finished_at ?? l.price_run.started_at)) : "—")}
      ${item("status", status)}
    </dl>`;
}

async function loadRisk() {
  const sec = $("#sec-risk"), host = $("[data-body]", sec);
  const tHost = $("#sec-trail [data-body]");
  let risk;
  try { risk = await api("/risk"); } catch { sec.dataset.riskState = "RISCO_ERRO"; sectionError(host, loadRisk); return; }
  const l = risk.latest; // os outros estados (E2–E9, E6b) são da T4
  sec.dataset.riskState = "E1";
  host.removeAttribute("aria-busy");
  host.innerHTML = `<div class="ruvor-stack">
    <div class="ruvor-levels">${ALPHAS.map((a) => levelPanel(l.results, a)).join("")}</div>
    ${modelsTable(l.results, l.test_count)}
  </div>`;
  for (const btn of host.querySelectorAll(".ruvor-table__toggle")) {
    btn.addEventListener("click", () => {
      const open = btn.getAttribute("aria-expanded") !== "true";
      btn.setAttribute("aria-expanded", String(open));
      document.getElementById(btn.getAttribute("aria-controls")).hidden = !open;
    });
  }
  tHost.removeAttribute("aria-busy");
  tHost.innerHTML = trail(l);
  $("[data-foot-asof]").textContent = T("rodape.ultimoPregao", fDate(l.as_of_date));
  $("[data-foot-calc]").textContent = T("rodape.calculadoEm", fInstant(l.calculated_at));
  done("risk");
}

// ---------------------------------------------------------------- tema e partida
const root = document.documentElement;
const switches = document.querySelectorAll("[data-set-theme]");
function setTheme(theme) {
  if (theme === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", theme);
  for (const b of switches) b.setAttribute("aria-pressed", String(b.dataset.setTheme === theme));
  redrawAll(); // o canvas não lê var(): recria com as cores do tema novo
}
for (const b of switches) b.addEventListener("click", () => setTheme(b.dataset.setTheme));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!root.hasAttribute("data-theme")) redrawAll(); });

const ready = new Set();
function done(part) { ready.add(part); if (ready.has("head") && ready.has("risk")) document.body.dataset.ready = "true"; }

variants();
loadHead(); loadPrice(); loadEvents(); loadBehavior(); loadRisk();
