<title>Ruvor — os estados da tela do ativo (mockup, M1.6b)</title>
<link rel="stylesheet" href="../../../brand/ruvor/tokens.css">
<link rel="stylesheet" href="../../../brand/ruvor/components.css">
<style>
  /*
   * Mockup dos estados da tela do ativo (T4 do plano M1.6b). O desenho é o do ativo.html
   * aprovado (T3); o casco e o rodapé, os do busca.html aprovado (T2). Dado montado à mão:
   * os corpos de /risk, /metrics e da identidade estão escritos neste arquivo, com os campos
   * reais de backend/apps/api/serializers.py e views.py. Não pede nada à API.
   *
   * Só var(--ruvor-*) e valores estruturais: nenhuma cor literal.
   *
   * O estilo local deste mockup (bsc-, copiado do busca.html; atv-, do ativo.html; est-, novo
   * aqui) foi levado a brand/ruvor/components.css pela T5, com o prefixo ruvor-; a tela usa as
   * classes do kit. O que fica aqui:
   *   - a moldura do mockup (mk-), que não é tela;
   *   - est-split, que mostra a seção de risco com a trilha ao lado, fora da tela inteira: no
   *     produto, é a .ruvor-workspace com a .ruvor-rail.ruvor-rail--stack;
   *   - abaixo de 720 px, a primeira coluna da tabela dos modelos a 30% (o kit, como o
   *     ativo.html, a deixa em 34%) e a família do modelo com o recuo de 24 px (o kit, como o
   *     ativo.html, a recua 20 px, alinhada ao nome) — o que este mockup mostrava.
   */

  /* --- Moldura do mockup: não é tela ------------------------------------------------ */
  .mk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruvor-space-2) var(--ruvor-space-3); padding: var(--ruvor-space-2) var(--ruvor-space-5); background: var(--ruvor-surface-2); border-bottom: 1px dashed var(--ruvor-text-muted); }
  .mk-bar .ruvor-eyebrow { margin: 0; color: var(--ruvor-text-muted); }
  .mk-group { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruvor-space-1); }
  .mk-group > span { font-size: var(--ruvor-type-micro-size); color: var(--ruvor-text-muted); margin-right: var(--ruvor-space-1); }
  .mk-bar .ruvor-btn { padding: 4px 9px; font-size: var(--ruvor-type-micro-size); }
  .mk-bar .ruvor-btn[aria-pressed="true"] { border-color: var(--ruvor-ink); box-shadow: inset 0 0 0 1px var(--ruvor-ink); }
  .mk-cases { display: flex; flex-direction: column; gap: var(--ruvor-space-7); }
  .mk-case { display: flex; flex-direction: column; gap: var(--ruvor-space-4); min-width: 0; }
  .mk-case[hidden] { display: none; }
  .mk-case__head { display: flex; flex-direction: column; gap: var(--ruvor-space-1); padding: var(--ruvor-space-2) var(--ruvor-space-3); border: 1px dashed var(--ruvor-text-muted); border-radius: var(--ruvor-radius-sm); background: var(--ruvor-surface-2); color: var(--ruvor-text-muted); font-size: var(--ruvor-type-micro-size); }
  .mk-case__head b { color: var(--ruvor-ink); font-family: var(--ruvor-font-mono); }
  .mk-case__head p { margin: 0; }
  .mk-case__head summary { cursor: pointer; }
  .mk-json { margin: var(--ruvor-space-2) 0 0; max-height: 320px; overflow: auto; font-family: var(--ruvor-font-mono); font-size: var(--ruvor-type-micro-size); white-space: pre; color: var(--ruvor-text); }
  .mk-motivos { width: 100%; }
  .mk-motivos td:first-child, .mk-motivos td:nth-child(2) { font-family: var(--ruvor-font-mono); font-size: var(--ruvor-type-micro-size); color: var(--ruvor-text-muted); }

  /* --- A seção de risco com a trilha ao lado, fora da tela inteira ------------------ */
  .est-split { display: grid; grid-template-columns: minmax(0, 1fr) 292px; gap: 0; border: 1px solid var(--ruvor-border); border-radius: var(--ruvor-radius-md); overflow: hidden; background: var(--ruvor-paper); }
  .est-split > .est-split__main { padding: var(--ruvor-space-5); min-width: 0; }

  @media (max-width: 1000px) {
    .est-split { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 720px) {
    .mk-bar { padding-inline: var(--ruvor-space-4); }
    .est-split > .est-split__main { padding: var(--ruvor-space-4) var(--ruvor-space-3); }
    .est-split > .ruvor-rail { padding: var(--ruvor-space-4) var(--ruvor-space-3); }
    .ruvor-table__col--lead { width: 30%; }
    .ruvor-table__sub { margin-left: calc(16px + var(--ruvor-space-2)); }
  }
</style>
</head>

function discordancia(results, alpha) {
  const v = results.filter((r) => r.alpha === alpha && r.var_latest != null).map((r) => lossFromVar(Number(r.var_latest)));
  if (v.length === 0) return null;
  return { min: Math.min(...v), max: Math.max(...v), n: v.length, total: MODEL_ORDER.length };
}
function naoRejeitados(results, alpha) {
  const at = results.filter((r) => r.alpha === alpha);
  return { adequados: MODEL_ORDER.filter((m) => at.some((r) => r.model_name === m && r.adequate === true)), julgados: at.filter((r) => r.adequate !== null).length };
}
const verdictTag = (r) => (r == null || r.adequate == null
  ? `<span class="ruvor-tag ruvor-tag--neutral">${esc(T("risco.tag.naoJulgado"))}</span>`
  : r.adequate ? `<span class="ruvor-tag ruvor-tag--validated">${esc(T("risco.tag.adequado"))}</span>`
               : `<span class="ruvor-tag ruvor-tag--review">${esc(T("risco.tag.naoAdequado"))}</span>`);
function levelPanel(results, alpha) {
  const d = discordancia(results, alpha);
  const nr = naoRejeitados(results, alpha);
  const cadaN = NIVEL_N[alpha];
  const range = d == null ? "—" : d.n === 1 ? fLoss.format(d.min) : T("risco.faixa", fLoss.format(d.min), fLoss.format(d.max));
  const perda = alpha === "0.0500" ? T("risco.perda95") : T("risco.perda99");
  const disc = T("risco.discordancia", d && fLoss.format(d.min), d && fLoss.format(d.max), d?.n ?? 0, MODEL_ORDER.length, cadaN, d && fLoss.format(d.min));
  const list = nr.adequados.map((m) => `<li><span class="ruvor-tag ruvor-tag--validated">${glyph("i-check-circle", "ruvor-glyph--sm")}${esc(T(`risco.modelo.${m}`))}</span></li>`).join("");
  return `<article class="ruvor-panel"><div class="ruvor-panel__body ruvor-level">
    <p class="ruvor-eyebrow">${esc(T(`risco.nivel.${alpha}`))}</p>
    <p class="ruvor-range"><b class="ruvor-num">${esc(range)}</b><small>${esc(T("risco.horizonte"))}</small></p>
    ${why(perda)}
    ${why(disc)}
    <div class="ruvor-divider"></div>
    <p class="ruvor-level__title">${esc(T("risco.naoRejeitados.titulo"))}</p>
    ${list ? `<ul class="ruvor-tag-list">${list}</ul>` : ""}
    ${why(T("risco.naoRejeitados", nr.adequados.length, nr.julgados, MODEL_ORDER.length))}
  </div></article>`;
}
function modelsTable(results) {
  const at = (m, a) => results.find((r) => r.model_name === m && r.alpha === a) ?? null;
  const all = results.filter((r) => r.var_latest != null).map((r) => lossFromVar(Number(r.var_latest)));
  const scale = Math.max(...all, 0) || 1;
  const cell = (r) => {
    if (r == null || r.var_latest == null) return `<td><div class="ruvor-cell-stack"><span class="ruvor-loss"><b class="ruvor-num">—</b></span>${verdictTag(r)}</div></td>`;
    const l = lossFromVar(Number(r.var_latest));
    return `<td><div class="ruvor-cell-stack"><span class="ruvor-loss"><b class="ruvor-num">${esc(fLoss.format(l))}</b></span><span class="ruvor-bar ruvor-bar--evidence" aria-hidden="true"><span class="ruvor-bar__fill" style="width: ${(100 * l / scale).toFixed(1)}%"></span></span>${verdictTag(r)}</div></td>`;
  };
  const rows = MODEL_ORDER.map((m) => `<tr data-model="${m}">
      <td><button class="ruvor-table__toggle" type="button" aria-expanded="false" aria-label="${esc(T("risco.tabela.abrir", T(`risco.modelo.${m}`)))}">${glyph("i-caret-right")}<span>${esc(T(`risco.modelo.${m}`))}</span></button><span class="ruvor-table__sub">${esc(T(`risco.categoria.${CATEGORY[m]}`))}</span></td>
      ${cell(at(m, "0.0500"))}${cell(at(m, "0.0100"))}
    </tr>`).join("");
  return `<section class="ruvor-panel">
    <div class="ruvor-panel__head">${glyph("i-scales")}<h3 class="ruvor-h3">${esc(T("risco.tabela.titulo"))}</h3></div>
    <div class="ruvor-panel__body">
      ${why(T("risco.tabela.intro"))}
      <div class="ruvor-legend" style="margin: var(--ruvor-space-3) 0 var(--ruvor-space-2); align-items: center">${verdictTag({ adequate: true })}${verdictTag({ adequate: false })}${verdictTag(null)}</div>
      ${why(T("risco.veredito"))}
    </div>
    <table class="ruvor-table ruvor-table--models">
      <colgroup><col class="ruvor-table__col--lead"><col><col></colgroup>
      <thead><tr><th scope="col">${esc(T("risco.tabela.col.modelo"))}</th><th scope="col">${esc(T("risco.tabela.col.0.0500"))}</th><th scope="col">${esc(T("risco.tabela.col.0.0100"))}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </section>`;
}
function trail(l) {

add("comportamento", "metric: null", "/metrics devolve { ticker, metric: null } — aponta para o convite do risco", { ticker: "AALR3", metric: null },
  `<section class="ruvor-stack">${behaviorHead(null)}

  </section>`);
{
  const m = METRIC_CURTA;
  const x100 = (r) => fMoney.format(100 * (1 + r));
  const months = { return_1m: 1, return_3m: 3, return_6m: 6, return_12m: 12, return_36m: 36, return_60m: 60, return_120m: 120, return_ytd: null };
  const rets = Object.entries(months).map(([k, mo]) => (m[k] == null ? stat(k, "—", mo ? T("comportamento.nulo.janela", mo) : "") : stat(k, minus(fPctS.format(Number(m[k]))), T(`comportamento.${k}`, x100(Number(m[k])))))).join("");
  const vols = stat("volatility_12m", fPct1.format(Number(m.volatility_12m)), T("comportamento.volatility_12m", fPct1.format(Number(m.volatility_12m)))) + stat("volatility_60m", "—", T("comportamento.nulo.janela", 60));
  const hist = `<p class="ruvor-muted">${esc(T("comportamento.histogramaCurto"))}</p>
    <div class="ruvor-stats" style="margin-top: var(--ruvor-space-5)">${stat("skewness", "—", T("comportamento.nulo.janela", 60))}${stat("excess_kurtosis", "—", T("comportamento.nulo.janela", 60))}</div>`;

      ${block("comportamento.bloco.distribuicao", hist, null)}

}

// ---------------------------------------------------------------- montagem
const host = $("#cases");
host.innerHTML = cases.map((c, i) => `<section class="mk-case" data-view="${c.view}" aria-label="${esc(c.tag)}">
  <div class="mk-case__head">
    <p><b>${esc(c.tag)}</b> · ${esc(c.what)}</p>

  ${c.screen}
</section>`).join("");

// A linha que abre, como no ativo.html (no E2 as linhas começam fechadas).
for (const btn of host.querySelectorAll(".ruvor-table__toggle")) {
  btn.addEventListener("click", () => btn.setAttribute("aria-expanded", String(btn.getAttribute("aria-expanded") !== "true")));
}
for (const a of host.querySelectorAll("a[href='#']")) a.addEventListener("click", (e) => e.preventDefault());

// ---------------------------------------------------------------- tema e seletor
const root = document.documentElement;
const themeBtns = document.querySelectorAll("[data-set-theme]");
function setTheme(theme) {
  if (theme === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", theme);
  for (const b of themeBtns) b.setAttribute("aria-pressed", String(b.dataset.setTheme === theme));
}
for (const b of themeBtns) b.addEventListener("click", () => setTheme(b.dataset.setTheme));

const mkBtns = document.querySelectorAll("[data-mk]");
function setView(view) {
  for (const b of mkBtns) b.setAttribute("aria-pressed", String(b.dataset.mk === view));
  for (const c of host.querySelectorAll(".mk-case")) c.hidden = !(view === "todos" || c.dataset.view === view);
}
for (const b of mkBtns) b.addEventListener("click", () => setView(b.dataset.mk));

// ?estado=…&tema=light|dark|system — para capturar cada vista direto.
const params = new URLSearchParams(location.search);
setTheme(params.get("tema") || "system");
setView(params.get("estado") || "todos");
document.body.dataset.ready = "true";
</script>
