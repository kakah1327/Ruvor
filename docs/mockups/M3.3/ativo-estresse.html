  "comportamento.estresse.period_return": (x, inicio, fim) => `Do primeiro ao último pregão do episódio, de ${inicio} a ${fim}, com os proventos: R$ 100 viraram ${x}.`,
  "comportamento.estresse.benchmark_period_return": (x) => `O Ibovespa no mesmo recorte de datas: R$ 100 viraram ${x}.`,
  "comportamento.estresse.drawdown": (queda, topo, fundo, inteira) => `Dentro do episódio, o preço ajustado caiu ${queda}, de ${topo} a ${fundo}.${inteira ? " Começou o episódio no topo e terminou no fundo: por isso a queda é igual ao resultado do início ao fim." : ""}`,
  "comportamento.estresse.benchmark_drawdown": (queda, inteira) => `A maior queda do Ibovespa dentro do mesmo recorte: ${queda}.${inteira ? " O índice começou o recorte no topo e terminou no fundo: por isso a queda é igual ao resultado do início ao fim." : ""}`,
  "comportamento.estresse.recovery_sessions": (volta) => `Pregões entre o fundo dessa queda e a volta ao topo dela, em ${volta} — contando também depois do fim do episódio.`,
  "comportamento.estresse.benchmark_recovery_sessions": (volta) => `O mesmo para o Ibovespa: do fundo da queda dele à volta ao topo dela, ${volta}.`,
  "comportamento.estresse.semDado.rotulo": "Sem dado",
  "comportamento.estresse.semDado.starts_after": "O ativo ainda não tinha preço no início deste episódio.",
  "comportamento.estresse.semDado.stale_start": "O último preço do ativo antes deste episódio é de mais de 10 dias antes dele.",
  "comportamento.estresse.semDado.ends_before": "A série do ativo termina antes do fim deste episódio.",
  "comportamento.estresse.semDado.no_trading": "O ativo não negociou durante este episódio.",
  "comportamento.estresse.semQueda": "Dentro do episódio, o preço nunca ficou abaixo do maior preço alcançado até ali.",
  "comportamento.estresse.nadaARecuperar": "sem queda no episódio, nada a recuperar",
  "comportamento.estresse.semIbov": "sem o Ibovespa neste recorte",
  "comportamento.estresse.naoCalculado": "Os momentos de estresse ainda não foram calculados para estes números. Entram no próximo cálculo do comportamento, no dia útil seguinte.",
};

// A leitura avançada (D-152): as seis frases de medida, mesma chave e mesmos argumentos, na
// mesma ordem. Cada afirmação confere em backend/apps/analytics/stress.py (a coluna "confere em").
const TEXTOS_AVANCADOS = {
  "comportamento.max_drawdown": (queda, topo, fundo, desde, volta) => `A maior queda da série inteira do fechamento ajustado que o Yahoo Finance informa, desde ${desde}: a razão mais negativa entre o fechamento ajustado de um pregão e o topo anterior a ele, menos 1 — do topo de ${topo} ao fundo de ${fundo}, uma queda de ${queda}. No empate, ficam o primeiro topo de um platô e a primeira queda de mesma profundidade. ${volta ? `A volta é o primeiro pregão depois do fundo cujo fechamento ajustado alcança o do topo: ${volta}.` : "Nenhum pregão depois do fundo alcançou o fechamento ajustado do topo: a volta nula é informação, não falta de histórico."}`,
  "comportamento.max_drawdown_recovery_sessions": (anos) => `Pregões contados do fundo, exclusive, à volta ao topo, inclusive — fundo no pregão 5 e volta no 8 dão 3. Divididos por 252, o ano de bolsa, dão cerca de ${anos} anos.`,
  "comportamento.estresse.period_return": (x, inicio, fim) => `Retorno simples do fechamento ajustado que o Yahoo Finance informa, do pregão-base ao pregão final: o pregão-base é o último em ou antes da data de início do episódio, e o final, o último em ou antes da data de fim — aqui, ${inicio} e ${fim}. O fechamento ajustado do final sobre o do pregão-base, menos 1. R$ 100 × (1 + retorno) = ${x}.`,
  "comportamento.estresse.benchmark_period_return": (x) => `O mesmo retorno simples, sobre o fechamento do Ibovespa, com o pregão-base e o final tirados da série do próprio índice, pelas mesmas datas de calendário — as datas do índice e as da ação não se emparelham. R$ 100 × (1 + retorno) = ${x}.`,
  "comportamento.estresse.drawdown": (queda, topo, fundo, inteira) => `A razão mais negativa, entre o pregão-base e o final, do fechamento ajustado de um pregão sobre o maior fechamento ajustado anterior a ele dentro da janela, menos 1 — topo de antes do episódio não entra. Do topo de ${topo} ao fundo de ${fundo}: ${queda}. No empate, ficam o primeiro topo de um platô e a primeira queda de mesma profundidade.${inteira ? " Aqui o topo é o pregão-base e o fundo é o final: a queda coincide com o retorno do recorte." : ""}`,
  "comportamento.estresse.benchmark_drawdown": (queda, inteira) => `A mesma maior queda dentro da janela, na série do Ibovespa: ${queda}.${inteira ? " Aqui o topo é o pregão-base e o fundo é o final: a queda coincide com o retorno do recorte." : ""}`,
  "comportamento.estresse.recovery_sessions": (volta) => `Pregões contados do fundo, exclusive, ao primeiro pregão da série inteira — não só da janela — cujo fechamento ajustado alcança o do topo da queda, inclusive: ${volta}. Sem esse pregão até o último calculado, o número é nulo.`,
  "comportamento.estresse.benchmark_recovery_sessions": (volta) => `A mesma contagem, do fundo, exclusive, à volta ao topo, inclusive, na série inteira do Ibovespa: ${volta}.`,
};

// Onde cada afirmação da avançada confere (caminho:linha em backend/apps/analytics/stress.py).
const CONFERE = {
  "comportamento.estresse.period_return": "stress.py:109-111",
  "comportamento.estresse.benchmark_period_return": "stress.py:176-177, 109-111",
  "comportamento.estresse.drawdown": "stress.py:113-130",
  "comportamento.estresse.benchmark_drawdown": "stress.py:176-177, 113-130",
  "comportamento.estresse.recovery_sessions": "stress.py:138-145",
  "comportamento.estresse.benchmark_recovery_sessions": "stress.py:176-177, 138-145",
  "comportamento.estresse.semDado.starts_after": "stress.py:88-90",
  "comportamento.estresse.semDado.stale_start": "stress.py:22, 91-92",
  "comportamento.estresse.semDado.ends_before": "stress.py:93-96",
  "comportamento.estresse.semDado.no_trading": "stress.py:97-98",
  "comportamento.estresse.semQueda": "stress.py:132-137",
  "comportamento.estresse.nadaARecuperar": "stress.py:132-137",
};

// Os exemplos de cada chave-função nova, cobrindo os ramos (o que a T6 leva a EXEMPLOS).
const EXEMPLOS = {
  "comportamento.estresse.recorte": [["17/05/2017", "30/06/2017"]],
  "comportamento.estresse.janela": [["14/11/2025", "30/12/2025"]],
  "comportamento.estresse.period_return": [["R$ 79,24", "17/05/2017", "30/06/2017"], ["R$ 141,00", "07/06/2021", "14/07/2022"]],
  "comportamento.estresse.benchmark_period_return": [["R$ 93,13"]],
  "comportamento.estresse.drawdown": [["25,4%", "17/05/2017", "21/06/2017", false], ["26,5%", "07/06/2021", "14/07/2022", true]],
  "comportamento.estresse.benchmark_drawdown": [["10,0%", false], ["26,5%", true]],
  "comportamento.estresse.recovery_sessions": [["20/09/2017"]],
  "comportamento.estresse.benchmark_recovery_sessions": [["07/08/2017"]],
};
const RAMO = {
  "comportamento.estresse.period_return": ["PETR4, JBS", "PETR4, juros (positivo)"],
  "comportamento.estresse.drawdown": ["inteira = false (PETR4, JBS)", "inteira = true (IBOV, juros)"],
  "comportamento.estresse.benchmark_drawdown": ["inteira = false", "inteira = true (juros)"],
};

// ---------------------------------------------------------------- o nível
const root = document.documentElement;
let reading = "beginner";
const T = (k, ...a) => { const v = TEXTOS[k]; if (v === undefined) throw new Error(`texto sem chave: ${k}`); return typeof v === "function" ? v(...a) : v; };
const P = (k, ...a) => {
  const v = reading === "advanced" && k in TEXTOS_AVANCADOS ? TEXTOS_AVANCADOS[k] : TEXTOS[k];
  if (v === undefined) throw new Error(`texto sem chave: ${k}`);
  return typeof v === "function" ? v(...a) : v;
};

// ---------------------------------------------------------------- utilidades
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const why = (text) => `<p class="ruvor-note">${esc(text)}</p>`;

for (const n of document.querySelectorAll("[data-t]")) n.textContent = T(n.dataset.t);
for (const n of document.querySelectorAll("[data-t-aria]")) n.setAttribute("aria-label", T(n.dataset.tAria));
for (const n of document.querySelectorAll("[data-t-placeholder]")) n.setAttribute("placeholder", T(n.dataset.tPlaceholder));

function stat(label, value, phrase, extra = "", attrs = "") {
  return `<div class="ruvor-stat${extra ? ` ${extra}` : ""}"${attrs}><span class="ruvor-stat__label">${esc(label)}</span><span class="ruvor-stat__value ruvor-num">${esc(value)}</span>${phrase ? why(phrase) : ""}</div>`;
}
function block(title, inner, note, wide = false, attrs = "") {
  return `<section class="ruvor-panel${wide ? " ruvor-blocks__wide" : ""}"${attrs}><div class="ruvor-panel__head"><h3 class="ruvor-h3">${esc(title)}</h3></div><div class="ruvor-panel__body">${inner}${note ? `<p class="ruvor-note ruvor-panel__note">${esc(note)}</p>` : ""}</div></section>`;
}
const x100 = (r) => fMoney.format(100 * (1 + r));
const L = (k) => T(`comportamento.estresse.rotulo.${k}`);

// ---------------------------------------------------------------- o bloco
// A linha do ativo e a do índice, medida a medida: na grade de duas colunas, a ordem do DOM é
// ativo, índice, ativo, índice... — em uma coluna, cada medida do ativo vem seguida da do índice.
function assetCells(e) {
  if (e.missing) {
    return [stat(T("comportamento.estresse.semDado.rotulo"), "—", T(`comportamento.estresse.semDado.${e.missing}`), "str-span", ' data-side="asset"')];
  }
  const r = Number(e.period_return), d = Number(e.drawdown);
  const inteira = e.drawdown_peak_date === e.window_start_date && e.drawdown_trough_date === e.window_end_date;
  const ret = stat(L("period_return"), minus(fPctS.format(r)), P("comportamento.estresse.period_return", x100(r), fDate(e.window_start_date), fDate(e.window_end_date)));
  if (d === 0) {
    return [ret,
      stat(L("drawdown"), fPct1.format(0), T("comportamento.estresse.semQueda")),
      stat(L("recovery_sessions"), "—", T("comportamento.estresse.nadaARecuperar"))];
  }
  return [ret,
    stat(L("drawdown"), minus(fPct1.format(d)), P("comportamento.estresse.drawdown", fPct1.format(Math.abs(d)), fDate(e.drawdown_peak_date), fDate(e.drawdown_trough_date), inteira && d !== 0)),
    e.recovery_sessions == null
      ? stat(L("recovery_sessions"), "—", T("comportamento.nulo.naoRecuperou"))
      : stat(L("recovery_sessions"), fInt.format(e.recovery_sessions), P("comportamento.estresse.recovery_sessions", fDate(e.recovery_date)))];
}
function benchCells(e, ticker) {
  if (e.benchmark_period_return == null) {
    const phrase = ticker === "IBOV" ? T("comportamento.nulo.referencia") : T("comportamento.estresse.semIbov");
    return [stat(L("benchmark_period_return"), "—", phrase, "str-span str-span--bench", ' data-benchmark="none"')];
  }
  const r = Number(e.benchmark_period_return), d = Number(e.benchmark_drawdown);
  const inteira = r === d && d !== 0;
  const ret = stat(L("benchmark_period_return"), minus(fPctS.format(r)), P("comportamento.estresse.benchmark_period_return", x100(r)));
  if (d === 0) {
    return [ret,
      stat(L("benchmark_drawdown"), fPct1.format(0), T("comportamento.estresse.semQueda")),
      stat(L("benchmark_recovery_sessions"), "—", T("comportamento.estresse.nadaARecuperar"))];
  }
  return [ret,
    stat(L("benchmark_drawdown"), minus(fPct1.format(d)), P("comportamento.estresse.benchmark_drawdown", fPct1.format(Math.abs(d)), inteira)),
    e.benchmark_recovery_sessions == null
      ? stat(L("benchmark_recovery_sessions"), "—", T("comportamento.nulo.naoRecuperou"))
      : stat(L("benchmark_recovery_sessions"), fInt.format(e.benchmark_recovery_sessions), P("comportamento.estresse.benchmark_recovery_sessions", fInt.format(e.benchmark_recovery_sessions) + " pregões"))];
}
function interleave(a, b) {
  // Com um lado ocupando as três linhas (str-span), ele vai primeiro e o outro lado segue.
  if (a.length === 1 || b.length === 1) return [...a, ...b];
  return a.flatMap((x, i) => [x, b[i]]);
}
function episode(e, ticker) {
  const dates = T("comportamento.estresse.recorte", fDate(e.start_date), fDate(e.end_date));
  const differ = e.window_start_date && (e.window_start_date !== e.start_date || e.window_end_date !== e.end_date);
  const window = differ ? ` · ${T("comportamento.estresse.janela", fDate(e.window_start_date), fDate(e.window_end_date))}` : "";
  return `<article class="str-episode" data-episode="${e.episode}"${e.missing ? ` data-missing="${e.missing}"` : ""}>
    <div class="str-episode__head"><h4 class="str-episode__name">${esc(T(`comportamento.estresse.episodio.${e.episode}`))}</h4><p class="str-episode__dates">${esc(dates + window)}</p></div>
    <div class="str-pair">${interleave(assetCells(e), benchCells(e, ticker)).join("")}</div>
  </article>`;
}
function stressBlock(stress, ticker) {
  const inner = stress.length === 0
    ? `<p class="ruvor-muted">${esc(T("comportamento.estresse.naoCalculado"))}</p>`
    : `<div class="str-episodes">${stress.map((e) => episode(e, ticker)).join("")}</div>`;
  return block(T("comportamento.bloco.estresse"), inner, stress.length === 0 ? null : T("comportamento.nota.estresse"), true, ' data-block="stress"');
}

// ---------------------------------------------------------------- a seção (o bloco depois de "Maior queda")
let ticker = "PETR4";
function renderAtivo() {
  const m = DADO[ticker];
  $("[data-asof]").textContent = T("comportamento.ate", fDate(m.as_of_date));
  const dd = Number(m.max_drawdown), rs = m.max_drawdown_recovery_sessions;
  const queda = stat(T("comportamento.rotulo.max_drawdown"), minus(fPct1.format(dd)), P("comportamento.max_drawdown", fPct1.format(Math.abs(dd)), fDate(m.max_drawdown_peak_date), fDate(m.max_drawdown_trough_date), fDate(m.first_price_date), m.max_drawdown_recovery_date ? fDate(m.max_drawdown_recovery_date) : null))
    + stat(T("comportamento.rotulo.max_drawdown_recovery_sessions"), fInt.format(rs), P("comportamento.max_drawdown_recovery_sessions", fDec1.format(rs / 252)));
  const ghost = (title) => `<section class="ruvor-panel str-ghost" aria-hidden="true"><div class="ruvor-panel__head"><h3 class="ruvor-h3">${esc(title)}</h3></div><div class="ruvor-panel__body"><p class="ruvor-muted">… (como hoje)</p></div></section>`;
  $("#sec-behavior [data-body]").innerHTML = `<div class="ruvor-blocks">
    ${ghost("Retornos").replace('class="ruvor-panel', 'class="ruvor-panel ruvor-blocks__wide')}
    ${ghost("Volatilidade")}
    ${block(T("comportamento.bloco.queda"), `<div class="ruvor-stats">${queda}</div>`)}
    ${stressBlock(m.stress, ticker)}
    ${ghost(T("comportamento.bloco.ibov"))}
    ${ghost("Proventos")}
  </div>`;
}

// ---------------------------------------------------------------- os estados (montados à mão)
function renderEstados() {
  const ibov = DADO.IBOV.stress, petr = DADO.PETR4.stress;
  const comIndice = (e) => ({ ...e, benchmark_period_return: ibov.find((i) => i.episode === e.episode).period_return,
    benchmark_drawdown: ibov.find((i) => i.episode === e.episode).drawdown, benchmark_recovery_sessions: ibov.find((i) => i.episode === e.episode).recovery_sessions });
  const semDado = (e, motivo) => ({ ...comIndice(e), missing: motivo, window_start_date: null, window_end_date: null, period_return: null, drawdown: null,
    drawdown_peak_date: null, drawdown_trough_date: null, recovery_date: null, recovery_sessions: null });
  const fig = (cap, html) => `<figure><figcaption>${esc(cap)}</figcaption>${html}</figure>`;
  const one = (e, t = "XPTO3") => stressBlock([e], t);
  $("#str-estados-note").innerHTML = `<p><b>Os estados do RF-12 que o banco não tem.</b> Cada um é o bloco com um episódio só; o lado do Ibovespa usa os números reais do IBOV no mesmo episódio. O ticker fictício <code>XPTO3</code> é só para a moldura.</p>
    <p>No ativo sem dado, o lado do ativo vira uma célula só, com o motivo, e o <b>Ibovespa continua mostrado</b> (RF-05). No índice nulo, o mesmo, do outro lado. A queda zero e a janela que difere do recorte são montadas sobre o PETR4 da JBS.</p>`;
  $("#str-states").innerHTML = [
    fig("ativo sem dado · starts_after (o Ibovespa mostrado)", one(semDado(petr[0], "starts_after"))),
    fig("ativo sem dado · stale_start", one(semDado(petr[1], "stale_start"))),
    fig("ativo sem dado · ends_before", one(semDado(petr[2], "ends_before"))),
    fig("ativo sem dado · no_trading", one(semDado(petr[3], "no_trading"))),
    fig("Ibovespa nulo fora do próprio IBOV (sem IBOV no catálogo, ou sem preço no recorte)", one({ ...petr[0], benchmark_period_return: null, benchmark_drawdown: null, benchmark_recovery_sessions: null })),
    fig("sem queda no episódio (drawdown = 0)", one({ ...petr[0], drawdown: "0E-10", drawdown_peak_date: "2017-05-17", drawdown_trough_date: "2017-05-17", recovery_date: null, recovery_sessions: null, period_return: "0.0412000000" })),
    fig("ainda não recuperou (recovery nulo) e a janela que difere do recorte (P0 e Pn em outro pregão)", one({ ...petr[0], window_start_date: "2017-05-16", window_end_date: "2017-06-29", recovery_date: null, recovery_sessions: null })),
    fig("stress: [] — a linha de métrica gravada antes do bloco", stressBlock([], "XPTO3")),
  ].join("");
}

// ---------------------------------------------------------------- os textos
function renderTextos() {
  $("#str-textos-head").innerHTML = `<p><b>Todas as chaves novas, nos dois níveis.</b> As seis frases de medida têm frase avançada (D-152, item 4: número novo nasce com as duas), com a mesma chave e os mesmos argumentos da iniciante; as outras chaves são iguais nos dois níveis. A coluna "confere em" aponta o trecho de <code>backend/apps/analytics/stress.py</code> que cada afirmação descreve.</p>
    <p><b>Para o portão:</b> (1) os nomes dos episódios; (2) a nota do bloco diz "o preço ajustado, com proventos e desdobramentos", como o RF-14 pede — é a mesma afirmação de <code>comportamento.nota.retornos</code>, que o ESTADO registra como não ancorada no código (o ajuste vem pronto do Yahoo); (3) a chave nova <code>comportamento.estresse.nadaARecuperar</code>, fora da tabela do plano: com a queda zero, a célula de pregões até recuperar precisa de frase própria, porque <code>naoRecuperou</code> diria o contrário; (4) <code>comportamento.estresse.semDado.rotulo</code>, o rótulo da célula do ativo sem dado.</p>
    <p>Nenhuma frase classifica: sem "melhor", "pior", "resistiu", "protegeu"; comparar com o índice é só pôr os números lado a lado.</p>`;
  const rows = [];
  const novas = Object.keys(TEXTOS).filter((k) => k.startsWith("comportamento.estresse.") || k === "comportamento.bloco.estresse" || k === "comportamento.nota.estresse");
  for (const k of novas) {
    const ini = TEXTOS[k], av = TEXTOS_AVANCADOS[k];
    const conf = CONFERE[k] ?? "";
    if (av && (typeof av !== typeof ini || (typeof av === "function" && av.length !== ini.length))) throw new Error(`assinatura diverge: ${k}`);
    if (typeof ini === "function") {
      const exs = EXEMPLOS[k];
      if (!exs) throw new Error(`sem exemplo: ${k}`);
      exs.forEach((a, i) => rows.push(`<tr><td>${esc(k)}</td><td>${esc((RAMO[k]?.[i] ? `${RAMO[k][i]}: ` : "") + JSON.stringify(a))}</td><td>${esc(ini(...a))}</td><td>${esc(av ? av(...a) : "(a mesma)")}</td><td>${esc(conf)}</td></tr>`));
    } else {
      rows.push(`<tr><td>${esc(k)}</td><td>texto</td><td>${esc(ini)}</td><td>(a mesma)</td><td>${esc(conf)}</td></tr>`);
    }
  }
  $("#str-textos-body").innerHTML = rows.join("");
}

// ---------------------------------------------------------------- tema, leitura e vista
const themeBtns = document.querySelectorAll("[data-set-theme]");
function setTheme(theme) {
  if (theme === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", theme);
  for (const b of themeBtns) b.setAttribute("aria-pressed", String(b.dataset.setTheme === theme));
}
for (const b of themeBtns) b.addEventListener("click", () => setTheme(b.dataset.setTheme));

let view = "PETR4";
function render() {
  for (const v of document.querySelectorAll(".str-view")) v.hidden = v.dataset.view !== (view === "PETR4" || view === "IBOV" ? "ativo" : view);
  if (view === "PETR4" || view === "IBOV") { ticker = view; renderAtivo(); }
  if (view === "estados") renderEstados();
  if (view === "textos") renderTextos();
}

const readingBtns = document.querySelectorAll("[data-set-reading]");
function setReading(r) {
  reading = r;
  root.setAttribute("data-reading", r);
  for (const b of readingBtns) b.setAttribute("aria-pressed", String(b.dataset.setReading === r));
  render();
}
for (const b of readingBtns) b.addEventListener("click", () => setReading(b.dataset.setReading));

const viewBtns = document.querySelectorAll("[data-str]");
function setView(v) {
  view = v;
  for (const b of viewBtns) b.setAttribute("aria-pressed", String(b.dataset.str === v));
  render();
}
for (const b of viewBtns) b.addEventListener("click", () => setView(b.dataset.str));

// ?vista=PETR4|IBOV|estados|textos&tema=light|dark|system&leitura=beginner|advanced
const params = new URLSearchParams(location.search);
setTheme(params.get("tema") || "system");
reading = params.get("leitura") === "advanced" ? "advanced" : "beginner";
for (const b of readingBtns) b.setAttribute("aria-pressed", String(b.dataset.setReading === reading));
root.setAttribute("data-reading", reading);
setView(params.get("vista") || "PETR4");
</script>
