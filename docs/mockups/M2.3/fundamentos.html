// ---------------------------------------------------------------- formatação (pt-BR), a do M1.6c
const NF = (o) => new Intl.NumberFormat("pt-BR", o);
const fPct1 = NF({ style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fMoney = NF({ style: "currency", currency: "BRL" });
const fMoney0 = NF({ style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const fInt = NF({ maximumFractionDigits: 0 });
const fDec1 = NF({ minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fDec2 = NF({ minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fInstantF = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const minus = (s) => s.replace(/^-/, "−");
const fDate = (s) => { const [y, m, d] = s.split("-"); return `${d}/${m}/${y}`; };
const fInstant = (s) => fInstantF.format(new Date(s)).replace(",", " às");
const COMPACT = [[1e12, "tri"], [1e9, "bi"], [1e6, "mi"], [1e3, "mil"]];
function fCompact(value) {
  const v = Number(value), a = Math.abs(v), sign = v < 0 ? "−" : "";
  for (const [base, unit] of COMPACT) if (a >= base) return `${sign}R$ ${fDec1.format(a / base)} ${unit}`;
  return `${sign}${fMoney0.format(a)}`;
}
const fMoneyFull = (value) => minus(fMoney.format(Number(value)));

// ---------------------------------------------------------------- o nível
const root = document.documentElement;
let reading = "beginner";
const T = (k, ...a) => { const v = TEXTOS[k]; if (v === undefined) throw new Error(`texto sem chave: ${k}`); return typeof v === "function" ? v(...a) : v; };
// textFor: a frase do nível corrente — a avançada substitui a iniciante (D-152), com os mesmos argumentos.
const P = (k, ...a) => {
  const v = reading === "advanced" && k in TEXTOS_AVANCADOS ? TEXTOS_AVANCADOS[k] : TEXTOS[k];
  if (v === undefined) throw new Error(`texto sem chave: ${k}`);
  return typeof v === "function" ? v(...a) : v;
};

// ---------------------------------------------------------------- utilidades
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const why = (text) => `<p class="ruvor-note">${esc(text)}</p>`;

for (const n of document.querySelectorAll("[data-t]")) n.textContent = T(n.dataset.t);
for (const n of document.querySelectorAll("[data-t-aria]")) n.setAttribute("aria-label", T(n.dataset.tAria));
for (const n of document.querySelectorAll("[data-t-placeholder]")) n.setAttribute("placeholder", T(n.dataset.tPlaceholder));

// ---------------------------------------------------------------- a seção (o desenho de FundamentalsSection.tsx)
// A atribuição dos nulos: cópia de frontend/src/content/nulos.ts. A frase do nulo sai por T(),
// nunca por P(): é a mesma nos dois níveis (RF-05).
const REASON_NULLS = {
  unit: ["price_date", "close", "eps", "bvps", "pe", "pb"],
  stale_statement: ["price_date", "close", "eps", "bvps", "pe", "pb"],
  no_share_count: ["eps", "bvps", "pe", "pb"],
  share_scale_unknown: ["eps", "bvps", "pe", "pb"],
  no_price: ["price_date", "close", "pe", "pb"],
};
const PLAN_NULLS = ["revenue_ttm", "ebit_ttm", "net_margin", "ebit_margin", "gross_debt", "cash", "net_debt", "net_debt_to_equity"];
const MARKET_CAP_REASONS = ["stale_statement", "no_share_count", "share_scale_unknown", "ambiguous_class", "no_price", "missing_class_price"];
function nullReason(ind, field) {
  const plan = ind.account_plan;
  if (plan !== "general" && PLAN_NULLS.includes(field)) {
    if (plan === "bank" || plan === "insurance") return { code: `plan:${plan}`, text: T("fundamentos.nulo.planoFinanceiro") };
    if (plan === "unknown") return { code: "plan:unknown", text: T("fundamentos.nulo.planoDesconhecido") };
  }
  const r = ind.per_share_missing;
  if (r != null && REASON_NULLS[r]?.includes(field)) return { code: `per_share:${r}`, text: T(`fundamentos.nulo.porAcao.${r}`) };
  const m = ind.market_cap_missing;
  if (field === "market_cap" && m != null && MARKET_CAP_REASONS.includes(m)) return { code: `market_cap:${m}`, text: T(`fundamentos.nulo.valorMercado.${m}`) };
  return { code: "generic", text: T("fundamentos.nulo.generico") };
}

const KIND = {
  revenue_ttm: "money", ebit_ttm: "money", net_income_ttm: "money", equity_parent: "money", total_assets: "money",
  gross_debt: "money", cash: "money", net_debt: "money", market_cap: "money",
  net_margin: "ratio", ebit_margin: "ratio", roe: "ratio", net_debt_to_equity: "ratio",
  close: "perShare", eps: "perShare", bvps: "perShare", pe: "multiple", pb: "multiple",
};
const BLOCKS = [
  ["resultado", ["revenue_ttm", "ebit_ttm", "net_income_ttm"]],
  ["rentabilidade", ["net_margin", "ebit_margin", "roe"]],
  ["endividamento", ["gross_debt", "cash", "net_debt", "net_debt_to_equity"]],
  ["porAcao", ["close", "eps", "bvps", "pe", "pb"]],
  ["tamanho", ["equity_parent", "total_assets", "market_cap"]],
];
const PEER_FIELDS = ["roe", "net_margin", "ebit_margin", "net_debt_to_equity", "pe", "pb"];
const ratio = (v) => minus(fPct1.format(Number(v)));
const times = (v) => T("fundamentos.vezes", minus(fDec2.format(Number(v))));
function display(field, v) {
  switch (KIND[field]) {
    case "money": return { text: fCompact(v), full: fMoneyFull(v) };
    case "ratio": return { text: ratio(v) };
    case "perShare": return { text: fMoneyFull(v) };
    default: return { text: times(v) };
  }
}
const per100 = (v) => fMoney.format(Math.abs(100 * Number(v)));

// A frase de um número presente, pelo nível (P). lastPriceDate: o último pregão da identidade.
function phrase(field, ind, lastPriceDate) {
  const v = Number(ind[field]), neg = v < 0;
  const shares = ind.shares_total == null ? "—" : fInt.format(ind.shares_total);
  const pd = ind.price_date ? fDate(ind.price_date) : "—";
  const close = ind.close == null ? "—" : fMoneyFull(ind.close);
  switch (field) {
    case "revenue_ttm": case "gross_debt": case "cash": case "total_assets": case "market_cap": return P(`fundamentos.${field}`);
    case "ebit_ttm": case "net_income_ttm": case "net_debt": case "equity_parent": return P(`fundamentos.${field}`, neg);
    case "net_margin": case "ebit_margin": case "roe": case "net_debt_to_equity": return P(`fundamentos.${field}`, per100(v), neg);
    case "close":
      return lastPriceDate && ind.price_date && ind.price_date < lastPriceDate
        ? P("fundamentos.closeOutraData", pd, fDate(lastPriceDate))
        : P("fundamentos.close", pd);
    case "eps": return P("fundamentos.eps", shares, neg);
    case "bvps": return P("fundamentos.bvps", shares);
    case "pe": return P("fundamentos.pe", pd, close, minus(fDec1.format(v)), neg);
    case "pb": return P("fundamentos.pb", pd, close, fDec2.format(v));
  }
  return "";
}

function peerSlot(field, peers) {
  const p = peers[field];
  const label = `<span class="ruvor-peer__label">${esc(T("fundamentos.pares.rotulo"))}</span>`;
  if (!p || p.median == null || p.percentile == null || p.count == null || p.count < 3) return `<div class="ruvor-peer">${label}${why(T("fundamentos.pares.semComparacao"))}</div>`;
  const n = p.count, pct = Number(p.percentile);
  const k = Math.round(pct * (n - 1));
  const others = fInt.format(n - 1);
  const position = k === 0 ? P("fundamentos.pares.abaixoDeTodas", others) : P("fundamentos.pares.posicao", fInt.format(k), others);
  const med = P("fundamentos.pares.mediana", KIND[field] === "ratio" ? ratio(p.median) : times(p.median));
  return `<div class="ruvor-peer" data-peer-k="${k}" data-peer-n="${n - 1}">${label}
    <span class="ruvor-bar ruvor-bar--evidence" aria-hidden="true"><span class="ruvor-bar__fill" style="width: ${(100 * pct).toFixed(1)}%"></span></span>
    ${why(`${position} ${med}`)}</div>`;
}

function stat(field, ind, peers, lastPriceDate) {
  const raw = ind[field];
  let value, note;
  if (raw == null) {
    const r = nullReason(ind, field);
    value = `<span class="ruvor-stat__value ruvor-num" data-null-reason="${r.code}"><span aria-hidden="true">—</span><span class="ruvor-sr-only">${esc(T("fundamentos.semValor"))}</span></span>`;
    note = r.text;
  } else {
    const d = display(field, raw);
    value = `<span class="ruvor-stat__value ruvor-num">${d.full ? `<span aria-hidden="true">${esc(d.text)}</span><span class="ruvor-sr-only">${esc(d.full)}</span>` : esc(d.text)}</span>`;
    note = phrase(field, ind, lastPriceDate);
  }
  const peer = peers && PEER_FIELDS.includes(field) ? peerSlot(field, peers) : "";
  return `<div class="ruvor-stat" data-field="${field}"><span class="ruvor-stat__label">${esc(T(`fundamentos.rotulo.${field}`))}</span>${value}${why(note)}${peer}</div>`;
}

function statePanel(title, text = "") {
  return `<div class="ruvor-state ruvor-state--notice"><span class="ruvor-icon ruvor-icon--evidence"><svg aria-hidden="true" focusable="false"><use href="#i-duo-info"/></svg></span>
    <div class="ruvor-state__body"><p class="ruvor-state__title">${esc(title)}</p>${text ? `<p class="ruvor-state__text">${esc(text)}</p>` : ""}</div></div>`;
}
function peersNotice(peers) {
  if (peers == null) return statePanel(T("fundamentos.pares.indisponivel"));
  if (peers.peer_level === "segment") return statePanel(T("fundamentos.pares.segmento", peers.group_segment ?? "—"), T("fundamentos.pares.leitura"));
  if (peers.peer_level === "subsector") return statePanel(T("fundamentos.pares.subsetor", peers.group_subsector ?? "—"), T("fundamentos.pares.leitura"));
  return statePanel(T("fundamentos.pares.nenhum"));
}

const DATA = {};

// A seção inteira; nada recolhe (RF-06), e o corpo não tem aria-live (como FundamentalsSection.tsx).
function renderSection(ticker) {
  const host = $(`[data-host="${ticker}"]`);

  const head = (tag) => `<div class="ruvor-section-head"><div><p class="ruvor-eyebrow">${esc(T("fundamentos.sobrancelha"))}</p><h2 class="ruvor-h2" id="h-fnd-${ticker}">${esc(T("fundamentos.titulo"))}</h2></div>${tag}</div>
    <p class="ruvor-sub">${esc(T("fundamentos.intro"))}</p>`;
  if (!d || d.error) {
    host.innerHTML = `<section class="ruvor-stack" data-section="fundamentals" data-state="error" aria-labelledby="h-fnd-${ticker}">${head("")}<div><div class="ruvor-callout ruvor-callout--critical" role="alert">${esc(T("ativo.erroSecao"))}</div></div></section>`;
    return;
  }
  const ind = d.body.indicator, peers = d.body.peers;
  const last = d.asset?.last_price?.date ?? null;
  const [data = "", hora = ""] = fInstant(ind.calculated_at).split(" às ");
  const tag = `<span class="ruvor-tag ruvor-tag--evidence">${esc(T("fundamentos.proveniencia", fDate(ind.statement.reference_date), T(`fundamentos.fonte.${ind.statement.source}`), T("risco.trilha.instante", data, hora)))}</span>`;
  const blocks = BLOCKS.map(([k, fields]) => {
    const note = TEXTOS[`fundamentos.nota.${k}`];
    const stats = k === "porAcao"
      ? `<div class="ruvor-stats">${stat("close", ind, peers, last)}</div><div class="ruvor-divider ruvor-divider--spaced"></div><div class="ruvor-stats">${fields.slice(1).map((f) => stat(f, ind, peers, last)).join("")}</div>`
      : `<div class="ruvor-stats">${fields.map((f) => stat(f, ind, peers, last)).join("")}</div>`;
    return `<section class="ruvor-panel"><div class="ruvor-panel__head"><h3 class="ruvor-h3">${esc(T(`fundamentos.bloco.${k}`))}</h3></div>
      <div class="ruvor-panel__body">${stats}${note ? `<p class="ruvor-note ruvor-panel__note">${esc(note)}</p>` : ""}</div></section>`;
  }).join("");
  host.innerHTML = `<section class="ruvor-stack" data-section="fundamentals" data-state="ready" aria-labelledby="h-fnd-${ticker}">${head(tag)}
    <div><div class="ruvor-stack">${peersNotice(peers)}${blocks}${why(T("fundamentos.fonteNota"))}</div></div></section>`;
}

async function load(ticker) {
  try {
    const [rb, ra] = await Promise.all([fetch(`/api/v1/assets/${ticker}/fundamentals`), fetch(`/api/v1/assets/${ticker}`)]);
    if (!rb.ok || !ra.ok) throw new Error(`HTTP ${rb.status}/${ra.status}`);
    const body = await rb.json();
    if (!body.indicator) throw new Error("sem indicador");
    DATA[ticker] = { body, asset: await ra.json() };
  } catch {
    DATA[ticker] = { error: true };
  }
}

// ---------------------------------------------------------------- as notas do mockup (não são tela)
function notes() {
  const p = DATA.PETR4?.body?.indicator, v = DATA.VALE3?.body?.indicator;
  const pAsset = DATA.PETR4?.asset;
  $('[data-note="petr4"]').innerHTML = `<p><b>Nota do mockup · não é tela.</b> Nada recolhe nesta seção (RF-06): os dezessete indicadores, o preço usado e a posição entre os pares ficam abertos nos dois níveis; o alternador troca só a frase, nunca o número.</p>
    <p><b>O nulo, igual nos dois níveis (RF-05):</b> o valor de mercado do PETR4 sai sem valor${p ? ` (motivo gravado: falta o preço de uma classe — <code>data-null-reason="market_cap:${esc(p.market_cap_missing ?? "")}"</code>)` : ""}, e a frase do porquê não muda ao trocar a leitura; o mesmo com o P/L e o P/VP entre os pares (<q>${esc(T("fundamentos.pares.semComparacao"))}</q>). A frase do valor de mercado com número está na vista <b>VALE3 ao vivo</b> e na vista dos textos.</p>
    <p><b>O preço usado:</b> ${p && pAsset ? `o cálculo usou o fechamento de ${esc(fDate(p.price_date))}, e o último pregão coletado é ${esc(fDate(pAsset.last_price.date))}` : "o preço do cálculo é anterior ao último pregão coletado"} — por isso o PETR4 mostra <code>fundamentos.closeOutraData</code>; o ramo <code>fundamentos.close</code> está na vista dos textos, como os ramos negativos, que o PETR4 não tem.</p>`;
  $('[data-note="vale3"]').innerHTML = `<p><b>Nota do mockup · não é tela.</b> A VALE3 entra só pelos dois ramos que o PETR4 não exercita com dado real: o <b>valor de mercado com número</b>${v?.market_cap ? ` (${esc(fCompact(v.market_cap))})` : ""}, com a frase de <code>fundamentos.market_cap</code>, e a <b>posição zero entre os pares</b> — no ROE e na margem líquida, <code>fundamentos.pares.abaixoDeTodas</code>. A seção do portão é a do PETR4.</p>`;
  const others = DATA.VALE3?.body?.peers?.roe?.count ? fInt.format(DATA.VALE3.body.peers.roe.count - 1) : "3";
  const proposta = (o) => `Nenhuma das outras ${o} companhias do grupo com este indicador calculado tem número menor.`;
  for (const n of document.querySelectorAll('[data-note="abaixo"]')) n.innerHTML = `<p><b>Nota do mockup · não é tela · para o portão: a iniciante de <code>fundamentos.pares.abaixoDeTodas</code> pode ser falsa com empate.</b></p>
    <p>Como está (<code>frontend/src/content/textos.ts:601</code>), e como esta página a mostra na leitura iniciante: <q>${esc(TEXTOS["fundamentos.pares.abaixoDeTodas"](others))}</q></p>
    <p>O percentil conta só as companhias com valor <b>estritamente menor</b> (<code>backend/apps/fundamentals/peers.py:164</code>; conferência, divergência 1): com percentil zero, a ação pode estar <b>empatada</b> com o menor valor do grupo, e então não está abaixo de todas. A avançada já segue o código.</p>
    <p>Proposta de correção da iniciante, mesma chave e mesmo argumento: <q>${esc(proposta(others))}</q></p>
    <p>A decisão é do dono. A spec põe "mudar o que já está escrito na leitura iniciante" fora do bloco: aceitar a correção é uma <b>emenda ao "Fora" da spec</b>, como a do retorno no ano no portão da T6 — a spec muda, com a aprovação do dono, antes de a T13 tocar a iniciante. Esta página mostra a iniciante como está.</p>`;
}

// ---------------------------------------------------------------- os textos
function renderTextos() {
  $("#m23-textos-head").innerHTML = `<p><b>As 22 chaves de Fundamentos do RF-04, nas duas leituras</b> — as 18 <code>fundamentos.&lt;campo&gt;</code>, a variante <code>fundamentos.closeOutraData</code> e as 3 dos pares. A iniciante é a de <code>textos.ts</code>, como está; a avançada é a proposta deste portão, com a mesma chave e os mesmos argumentos (RF-05). Cada afirmação da avançada copia a de <code>docs/mockups/M2.3/conferencia-fundamentos.md</code>, onde está o <code>caminho:linha</code> que a confere.</p>
    <p><b>O que a conferência marca como não ancorado no código não entra:</b> o que a conta 3.01 contém (a avançada diz só "a conta 3.01"); o arrendamento dentro dos empréstimos e financiamentos (vem da D-122, medido na carga, não do código — a nota do bloco Endividamento, que não muda com o nível, continua dizendo); e por que a agenda é semanal (a avançada diz "no padrão, toda segunda-feira", que é o que o código fixa).</p>
    <p>Chave-função: uma linha por exemplo de <code>EXEMPLOS_AVANCADOS</code>, cobrindo os ramos da avançada — os negativos, <code>fundamentos.close</code> e <code>fundamentos.pares.abaixoDeTodas</code>, que o PETR4 não exercita, entram aqui; a coluna da iniciante mostra a iniciante com os mesmos argumentos. Chave de texto: uma linha. As frases do nulo (<code>fundamentos.nulo.*</code>, <code>fundamentos.pares.semComparacao</code>) não têm avançada: são as mesmas nos dois níveis.</p>
    <p>Divergência menor, sem proposta: a iniciante de <code>fundamentos.cash</code> diz "as aplicações financeiras", e o código soma só as do ativo circulante (conferência, divergência 3) — não é falso, é menos preciso; a avançada diz "do circulante".</p>`;
  const rows = [];
  for (const k of Object.keys(TEXTOS_AVANCADOS)) {
    const av = TEXTOS_AVANCADOS[k], ini = TEXTOS[k];
    if (typeof av !== typeof ini || (typeof av === "function" && av.length !== ini.length)) throw new Error(`assinatura diverge: ${k}`);
    if (typeof av === "function") {
      const exs = EXEMPLOS_AVANCADOS[k];
      if (!exs) throw new Error(`sem exemplo: ${k}`);
      exs.forEach((a, i) => rows.push(`<tr><td>${esc(k)}</td><td>${esc((RAMO[k]?.[i] ? `${RAMO[k][i]}: ` : "") + JSON.stringify(a))}</td><td>${esc(ini(...a))}</td><td>${esc(av(...a))}</td></tr>`));
    } else {
      rows.push(`<tr><td>${esc(k)}</td><td>texto</td><td>${esc(ini)}</td><td>${esc(av)}</td></tr>`);
    }
  }
  for (const k of Object.keys(EXEMPLOS_AVANCADOS)) if (!(k in TEXTOS_AVANCADOS)) throw new Error(`exemplo sem chave: ${k}`);
  if (Object.keys(TEXTOS_AVANCADOS).length !== 22) throw new Error("as chaves avançadas não são 22");
  $("#m23-textos-body").innerHTML = rows.join("");
}

// ---------------------------------------------------------------- tema, leitura e vista
const themeBtns = document.querySelectorAll("[data-set-theme]");
function setTheme(theme) {
  if (theme === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", theme);
  for (const b of themeBtns) b.setAttribute("aria-pressed", String(b.dataset.setTheme === theme));
}
for (const b of themeBtns) b.addEventListener("click", () => setTheme(b.dataset.setTheme));

const readingBtns = document.querySelectorAll("[data-set-reading]");
function setReading(r) {
  reading = r;
  root.setAttribute("data-reading", r);
  for (const b of readingBtns) b.setAttribute("aria-pressed", String(b.dataset.setReading === r));
  for (const t of Object.keys(DATA)) renderSection(t);
}
for (const b of readingBtns) b.addEventListener("click", () => setReading(b.dataset.setReading));

const viewBtns = document.querySelectorAll("[data-m23]");
function setView(view) {
  for (const b of viewBtns) b.setAttribute("aria-pressed", String(b.dataset.m23 === view));
  for (const v of document.querySelectorAll(".m23-view")) v.hidden = v.dataset.view !== view;
}
for (const b of viewBtns) b.addEventListener("click", () => setView(b.dataset.m23));

// ?vista=petr4|vale3|textos&tema=light|dark|system&leitura=beginner|advanced — para capturar cada vista direto.
const params = new URLSearchParams(location.search);
setTheme(params.get("tema") || "system");
setView(params.get("vista") || "petr4");
reading = params.get("leitura") === "advanced" ? "advanced" : "beginner";
renderTextos();
await Promise.all([load("PETR4"), load("VALE3")]);
notes();
setReading(reading);
document.body.dataset.ready = "true";
</script>
