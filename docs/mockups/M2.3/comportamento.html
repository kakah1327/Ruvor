   * Mockup da seção Comportamento nas duas leituras (T6 do plano M2.3). Dado real do ITUB4,
   * pedido a /api/v1/ pelo proxy do Vite. O desenho é o da seção aprovada no M1.6b (ativo.html)
   * e implementada em frontend/src/components/BehaviorSection.tsx; o que muda é a frase pelo
   * nível e o recolhimento da assimetria e da curtose (RF-06, RF-07).
   *
   * As frases avançadas copiam as afirmações de docs/mockups/M2.3/conferencia-comportamento.md;
   * o que lá está como não ancorado no código não entra.
   *
   * Só var(--ruvor-*) e valores estruturais: nenhuma cor literal. Estilo local só com m23-:
   *   - m23-collapsible: o CONTROLE DE RECOLHER, que nasce aqui (a T9 e a T12 o repetem; a T7 o
   *     leva ao kit). Derivado da linha expansível da tabela (.ruvor-table__toggle, a seta que
   *     gira com aria-expanded);
   *   - m23-prefs: a barra com as duas chaves, copiada do casco-e-preco.html (T3) revisado — o
   *     alternador antes do tema no DOM e em 1440; até 720 px, o alternador na 1ª linha, ao lado
   *     da marca, o tema na 2ª, à direita, e a busca na 3ª;
   *   - m23-bar, m23-note, m23-textos, m23-states: a moldura do mockup, que não é tela.
   */

  /* --- As três regras de cor fixa da folha do uPlot, sobrepostas por token (RF-22 do M1.6b) --- */
  .uplot .u-select { background: var(--ruvor-control-hover); }
  .uplot.u-hz .u-cursor-x, .uplot.u-vt .u-cursor-y { border-right-color: var(--ruvor-border); }
  .uplot.u-hz .u-cursor-y, .uplot.u-vt .u-cursor-x { border-bottom-color: var(--ruvor-border); }
  .uplot { font-family: var(--ruvor-font-sans); }

  /* --- O controle de recolher (proposta deste portão) --------------------------------- */
  /* O raiz: uma régua fina separa o controle do que vem antes (no bloco Distribuição, o
     histograma). Fechado, só o botão; aberto, o conteúdo logo abaixo dele. */
  .m23-collapsible { display: flex; flex-direction: column; gap: var(--ruvor-space-4); padding-top: var(--ruvor-space-3); border-top: 1px solid var(--ruvor-table-rule); }
  /* O botão: o .ruvor-table__toggle do kit — a seta à esquerda, que gira 90° aberto —, com o
     alvo de toque mais alto (6 px acima e abaixo) e o sublinhado no hover, que a linha da
     tabela não precisa porque a linha inteira reage. */
  .m23-collapsible__toggle { align-self: flex-start; display: inline-flex; align-items: center; gap: var(--ruvor-space-2); font: inherit; font-size: var(--ruvor-type-small-size); font-weight: var(--ruvor-type-small-weight); color: var(--ruvor-ink); background: transparent; border: 0; padding: 6px 0; cursor: pointer; text-align: left; }
  .m23-collapsible__toggle .ruvor-glyph { flex: none; transition: transform 0.15s; }
  .m23-collapsible__toggle[aria-expanded="true"] .ruvor-glyph { transform: rotate(90deg); }
  .m23-collapsible__toggle:hover span, .m23-collapsible__toggle.is-hover span { text-decoration: underline; text-underline-offset: 3px; }
  .m23-collapsible__toggle:focus-visible, .m23-collapsible__toggle.is-focus { outline: 2px solid var(--ruvor-focus); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { .m23-collapsible__toggle .ruvor-glyph { transition: none; } }

  /* --- A chave de tema e o alternador na barra: arranjo PROVISÓRIO (o casco é da T3) --- */
  .m23-prefs { display: flex; align-items: center; gap: var(--ruvor-space-3); justify-self: end; }
  @media (max-width: 720px) {
    .m23-prefs { display: contents; }
    .m23-prefs > [data-switch="reading"] { grid-column: 2; grid-row: 1; justify-self: end; }
    .m23-prefs > [data-switch="theme"] { grid-column: 1 / -1; grid-row: 2; justify-self: end; }
    .ruvor-topbar .ruvor-topbar__search { grid-row: 3; }
  }

  /* --- Moldura do mockup: não é tela --------------------------------------------------- */
  .m23-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruvor-space-2) var(--ruvor-space-3); padding: var(--ruvor-space-2) var(--ruvor-space-5); background: var(--ruvor-surface-2); border-bottom: 1px dashed var(--ruvor-text-muted); }
  .m23-bar .ruvor-eyebrow { margin: 0; color: var(--ruvor-text-muted); }
  .m23-group { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ruvor-space-1); }
  .m23-group > span { font-size: var(--ruvor-type-micro-size); color: var(--ruvor-text-muted); margin-right: var(--ruvor-space-1); }
  .m23-bar .ruvor-btn { padding: 4px 9px; font-size: var(--ruvor-type-micro-size); }
  .m23-bar .ruvor-btn[aria-pressed="true"] { border-color: var(--ruvor-ink); box-shadow: inset 0 0 0 1px var(--ruvor-ink); }
  .m23-view[hidden] { display: none; }
  .m23-note { margin: 0; padding: var(--ruvor-space-2) var(--ruvor-space-3); border: 1px dashed var(--ruvor-text-muted); border-radius: var(--ruvor-radius-sm); background: var(--ruvor-surface-2); color: var(--ruvor-text-muted); font-size: var(--ruvor-type-micro-size); display: flex; flex-direction: column; gap: var(--ruvor-space-1); }
  .m23-note b { color: var(--ruvor-ink); }
  .m23-note p { margin: 0; }
  .m23-note code { font-family: var(--ruvor-font-mono); }
  .m23-note q { color: var(--ruvor-text); }
  .m23-textos { table-layout: fixed; }
  .m23-textos td { vertical-align: top; overflow-wrap: anywhere; font-size: var(--ruvor-type-small-size); }
  .m23-textos td:first-child { font-family: var(--ruvor-font-mono); font-size: var(--ruvor-type-micro-size); color: var(--ruvor-text-muted); width: 22%; }
  .m23-textos td:nth-child(2) { font-family: var(--ruvor-font-mono); font-size: var(--ruvor-type-micro-size); color: var(--ruvor-text-muted); width: 16%; }
  .m23-states { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--ruvor-space-4); }
  .m23-states figure { margin: 0; display: flex; flex-direction: column; gap: var(--ruvor-space-2); }
  .m23-states figcaption { font-family: var(--ruvor-font-mono); font-size: var(--ruvor-type-micro-size); color: var(--ruvor-text-muted); }
  @media (max-width: 720px) {
    .m23-bar { padding-inline: var(--ruvor-space-4); }
    .m23-textos thead { display: none; }
    .m23-textos tr { display: block; padding: var(--ruvor-space-2) 0; border-bottom: 1px solid var(--ruvor-table-rule); }
    .m23-textos td { display: block; width: auto !important; border: 0; padding: 2px 0; }
  }
</style>

// ---------------------------------------------------------------- o nível
const root = document.documentElement;
let reading = "beginner";
const T = (k, ...a) => { const v = TEXTOS[k]; if (v === undefined) throw new Error(`texto sem chave: ${k}`); return typeof v === "function" ? v(...a) : v; };
// textFor: a frase do nível corrente — a avançada substitui a iniciante (D-152), com os mesmos argumentos.
const P = (k, ...a) => {
  const v = reading === "advanced" && k in TEXTOS_AVANCADOS ? TEXTOS_AVANCADOS[k] : TEXTOS[k];
  if (v === undefined) throw new Error(`texto sem chave: ${k}`);
  return typeof v === "function" ? v(...a) : v;
};

// ---------------------------------------------------------------- utilidades
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const glyph = (id, cls = "") => `<svg class="ruvor-glyph ${cls}" aria-hidden="true" focusable="false"><use href="#${id}"/></svg>`;
const why = (text) => `<p class="ruvor-note">${esc(text)}</p>`;
const tok = (name) => getComputedStyle(root).getPropertyValue(`--ruvor-${name}`).trim();

for (const n of document.querySelectorAll("[data-t]")) n.textContent = T(n.dataset.t);
for (const n of document.querySelectorAll("[data-t-aria]")) n.setAttribute("aria-label", T(n.dataset.tAria));
for (const n of document.querySelectorAll("[data-t-placeholder]")) n.setAttribute("placeholder", T(n.dataset.tPlaceholder));

// ---------------------------------------------------------------- o controle de recolher
// O molde do Collapsible.tsx do plano: aberto por padrão no avançado, fechado no iniciante;
// trocar o nível reaplica o padrão; abrir não é lembrado. O conteúdo fechado não é desenhado
// (fora da árvore acessível e do fluxo), e o aria-controls aponta para o id que só existe aberto.
const openState = { moments: false };
function collapsible(name, label, inner, open, id = `m23-${name}-body`) {
  return `<div class="m23-collapsible" data-collapsible="${name}" data-open="${open}">
    <button class="m23-collapsible__toggle" type="button" aria-expanded="${open}" aria-controls="${id}" data-toggle="${name}">${glyph("i-caret-right")}<span>${esc(label)}</span></button>
    ${open ? `<div id="${id}">${inner}</div>` : ""}
  </div>`;
}

// ---------------------------------------------------------------- gráficos (uPlot), o do M1.6b
const charts = new Map();
function colors() {
  return { evidence: tok("evidence"), critical: tok("critical"), surface: tok("surface"), ink: tok("ink"),
    muted: tok("text-muted"), rule: tok("table-rule"), font: `${tok("type-micro-size")} ${tok("font-sans")}` };
}
function axis(c, extra = {}) {
  return { stroke: c.muted, grid: { stroke: c.rule, width: 1 }, ticks: { stroke: c.rule, width: 1 }, font: c.font, ...extra };
}
function binRange(b) {
  if (b.lower_bound == null) return T("grafico.pontaInferior");
  if (b.upper_bound == null) return T("grafico.pontaSuperior");
  return T("grafico.faixa", minus(fPct1.format(Number(b.lower_bound))), minus(fPct1.format(Number(b.upper_bound))));
}
function drawHistogram(bins) {
  const xs = bins.map((b) => b.bin_index);
  const isNeg = (b) => b.upper_bound != null && Number(b.upper_bound) <= 0;
  const neg = bins.map((b) => (isNeg(b) ? b.count : null));
  const pos = bins.map((b) => (isNeg(b) ? null : b.count));
  let top = bins[0];
  for (const b of bins) if (b.count > top.count) top = b;
  $("#resumo-hist").textContent = T("grafico.resumoHistograma", binRange(top), fInt.format(top.count), bins[0].count, bins[bins.length - 1].count);
  const TICKS = [0.5, 10.5, 20.5, 30.5, 40.5];
  const TICK_V = [-0.1, -0.05, 0, 0.05, 0.1];
  let u = null;
  const make = () => {
    const box = $("#chart-hist");
    if (!box) return;
    u?.destroy(); box.replaceChildren();
    const c = colors();
    const bars = uPlot.paths.bars({ size: [0.86, Infinity], gap: 1 });
    const tip = document.createElement("div");
    tip.className = "ruvor-chart__tip"; tip.hidden = true; tip.setAttribute("aria-hidden", "true");
    u = new uPlot({
      width: box.clientWidth, height: 220,
      legend: { show: false },
      cursor: { points: { stroke: c.ink, fill: c.surface, size: 7 }, drag: { x: false, y: false } },
      scales: { x: { time: false, range: [-0.5, bins.length - 0.5] }, y: { range: (self, mn, mx) => [0, mx * 1.08] } },
      axes: [
        axis(c, { splits: () => TICKS, values: () => TICK_V.map((v) => minus(fPct0S.format(v))) }),
        axis(c, { size: 48, values: (self, splits) => splits.map((v) => fInt.format(v)) }),
      ],
      series: [{},
        { stroke: c.critical, fill: c.critical, paths: bars, points: { show: false, stroke: c.critical, fill: c.surface } },
        { stroke: c.evidence, fill: c.evidence, paths: bars, points: { show: false, stroke: c.evidence, fill: c.surface } }],
      hooks: {
        setCursor: [(self) => {
          const i = self.cursor.idx;
          if (i == null || self.cursor.left < 0) { tip.hidden = true; return; }
          tip.textContent = T("grafico.dicaBarra", binRange(bins[i]), bins[i].count);
          tip.style.left = `${self.valToPos(i, "x")}px`;
          tip.style.top = `${self.valToPos(bins[i].count, "y")}px`;
          tip.hidden = false;
        }],
      },
    }, [xs, neg, pos], box);
    u.over.appendChild(tip);
  };
  charts.set("hist", make);
  make();
  new ResizeObserver(() => u && $("#chart-hist") && u.setSize({ width: $("#chart-hist").clientWidth, height: 220 })).observe($("#chart-hist"));
}

// ---------------------------------------------------------------- a seção (o desenho de BehaviorSection.tsx)
const RETURNS = [["return_1m", 1], ["return_3m", 3], ["return_6m", 6], ["return_12m", 12], ["return_36m", 36], ["return_60m", 60], ["return_120m", 120], ["return_ytd", null]];
function stat(key, value, phrase) {
  return `<div class="ruvor-stat" data-field="${key}"><span class="ruvor-stat__label">${esc(T(`comportamento.rotulo.${key}`))}</span><span class="ruvor-stat__value ruvor-num">${esc(value)}</span>${phrase ? why(phrase) : ""}</div>`;
}
function block(titleKey, inner, note, wide = false, extra = "") {
  return `<section class="ruvor-panel${wide ? " ruvor-blocks__wide" : ""}"><div class="ruvor-panel__head"><h3 class="ruvor-h3">${esc(T(titleKey))}</h3></div><div class="ruvor-panel__body">${inner}${note ? `<p class="ruvor-note ruvor-panel__note">${esc(note)}</p>` : ""}</div>${extra}</section>`;
}
const signedDec = (v) => minus(fDec2.format(v));

let metric = null; // a resposta guardada: trocar o nível não pede nada à API (RF-03)

function momentsHtml(m) {
  const N = (k) => (m[k] == null ? null : Number(m[k]));
  const sk = N("skewness"), ku = N("excess_kurtosis");
  const inner = `<div class="ruvor-stats">${
    (sk == null ? stat("skewness", "—", T("comportamento.nulo.janela", 60)) : stat("skewness", signedDec(sk), P("comportamento.skewness", signedDec(sk), Math.sign(sk))))
    + (ku == null ? stat("excess_kurtosis", "—", T("comportamento.nulo.janela", 60)) : stat("excess_kurtosis", signedDec(ku), P("comportamento.excess_kurtosis", signedDec(ku), Math.sign(ku))))}</div>`;
  return collapsible("moments", T("comportamento.momentos.abrir"), inner, openState.moments);
}

function ytdNote() {
  const x = metric ? fMoney.format(100 * (1 + Number(metric.return_ytd))) : "R$ 114,98";
  const proposta = (v) => `Desde o fechamento do último pregão do ano passado, com os proventos: R$ 100 viraram ${v}.`;
  return `<p><b>Nota do mockup · não é tela · para o portão: a iniciante de <code>comportamento.return_ytd</code> contradiz o cálculo.</b></p>
    <p>Como está (<code>frontend/src/content/textos.ts:216</code>), e como esta página a mostra na leitura iniciante: <q>${esc(TEXTOS["comportamento.return_ytd"](x))}</q></p>
    <p>O cálculo parte do <b>fechamento do último pregão antes do ano corrente</b> — em regra, o do ano anterior —, não do primeiro pregão do ano (<code>backend/apps/analytics/metrics.py:119-126</code>; conferência, divergência 1). A avançada já segue o código.</p>
    <p>Proposta de correção da iniciante, mesma chave e mesmo argumento: <q>${esc(proposta(x))}</q></p>
    <p>A decisão é do dono. A spec põe "mudar o que já está escrito na leitura iniciante" fora do bloco, com exceção só para <code>risco.veredito</code> e <code>risco.naoRejeitados</code>: aceitar a correção é uma <b>emenda ao "Fora" da spec</b>, que é contrato aprovado — não basta registrar: a spec muda, com a aprovação do dono, antes de a T7 tocar a iniciante.</p>`;
}

function renderBehavior() {
  const sec = $("#sec-behavior"), host = $("[data-body]", sec);
  const m = metric;
  const asof = $("[data-asof]", sec);
  asof.hidden = false; asof.textContent = T("comportamento.ate", fDate(m.as_of_date));
  const N = (k) => (m[k] == null ? null : Number(m[k]));
  const x100 = (r) => fMoney.format(100 * (1 + r));

  const rets = RETURNS.map(([k, months]) => {
    const r = N(k);
    if (r == null) return stat(k, "—", months ? T("comportamento.nulo.janela", months) : "");
    return stat(k, minus(fPctS.format(r)), P(`comportamento.${k}`, x100(r)));
  }).join("");

  const vols = ["volatility_12m", "volatility_60m"].map((k) => {
    const v = N(k);
    return v == null ? stat(k, "—", T("comportamento.nulo.janela", k === "volatility_12m" ? 12 : 60)) : stat(k, fPct1.format(v), P(`comportamento.${k}`, fPct1.format(v)));
  }).join("");

  const dd = N("max_drawdown");
  const rs = m.max_drawdown_recovery_sessions;
  const drawdown = stat("max_drawdown", minus(fPct1.format(dd)), P("comportamento.max_drawdown", fPct1.format(Math.abs(dd)), fDate(m.max_drawdown_peak_date), fDate(m.max_drawdown_trough_date), fDate(m.first_price_date), m.max_drawdown_recovery_date ? fDate(m.max_drawdown_recovery_date) : null))
    + (rs == null ? stat("max_drawdown_recovery_sessions", "—", T("comportamento.nulo.naoRecuperou"))
                  : stat("max_drawdown_recovery_sessions", fInt.format(rs), P("comportamento.max_drawdown_recovery_sessions", fDec1.format(rs / 252))));

  const b = N("beta_60m"), c = N("correlation_60m");
  // No próprio Ibovespa, o nulo do beta e da correlação é identidade (BehaviorSection.tsx:183-185).
  const benchNull = TICKER === "IBOV" ? T("comportamento.nulo.referencia") : T("comportamento.nulo.janela", 60);
  const ibov = (b == null ? stat("beta_60m", "—", benchNull)
                          : stat("beta_60m", signedDec(b), P("comportamento.beta_60m", `${fDec2.format(Math.abs(b))}%`, b < 0)))
    + (c == null ? stat("correlation_60m", "—", benchNull)
                 : stat("correlation_60m", signedDec(c), P("comportamento.correlation_60m", signedDec(c))));

  const dy = N("dividend_yield_12m");
  const divs = stat("dividends_12m", fMoney.format(N("dividends_12m")), P("comportamento.dividends_12m"))
    + stat("dividend_payments_12m", fInt.format(m.dividend_payments_12m), P("comportamento.dividend_payments_12m"))
    + stat("dividend_yield_12m", fPct1.format(dy), P("comportamento.dividend_yield_12m", fDate(m.as_of_date), fMoney.format(100 * dy)));

  const vol = ["avg_volume_21d", "avg_volume_252d"].map((k) => {
    const v = N(k);
    return v == null ? stat(k, "—", T("comportamento.nulo.pregoes", k === "avg_volume_21d" ? 21 : 252)) : stat(k, T("comportamento.unidade.volume", fDec1.format(v / 1e6)), P(`comportamento.${k}`));
  }).join("");

  // O histograma fica aberto nos dois níveis (RF-06); só a assimetria e a curtose recolhem.
  // Com a série curta, a frase no lugar do gráfico, e o recolhível continua, com os nulos
  // dentro (BehaviorSection.tsx:316-350).
  const hist = m.statistical_observations == null
    ? `<div class="ruvor-stack"><p class="ruvor-muted">${esc(T("comportamento.histogramaCurto"))}</p>
       <div data-moments-host>${momentsHtml(m)}</div></div>`
    : `<div class="ruvor-stack">${why(P("comportamento.histograma"))}
       <div>
         <div class="ruvor-chart__bar">
           <div class="ruvor-legend" aria-hidden="true"><span><i class="ruvor-legend__swatch ruvor-legend__swatch--critical"></i>${esc(T("grafico.legendaQueda"))}</span><span><i class="ruvor-legend__swatch ruvor-legend__swatch--evidence"></i>${esc(T("grafico.legendaAlta"))}</span></div>
         </div>
         <div class="ruvor-chart" id="chart-hist" role="img" aria-describedby="resumo-hist"></div>
         <div class="ruvor-chart__ends" aria-hidden="true"><span>← ${esc(T("grafico.pontaInferior"))}</span><span>${esc(T("grafico.pontaSuperior"))} →</span></div>
         <p class="ruvor-note ruvor-chart__summary" id="resumo-hist"></p>
       </div>
       <div data-moments-host>${momentsHtml(m)}</div></div>`;

  host.removeAttribute("aria-busy");
  host.innerHTML = `<div class="ruvor-blocks">
    ${block("comportamento.bloco.retornos", `<div class="ruvor-stats">${rets}</div>`, T("comportamento.nota.retornos"), true,
      `<div class="ruvor-panel__body" style="padding-top: 0"><div class="m23-note">${ytdNote()}</div></div>`)}
    ${block("comportamento.bloco.volatilidade", `<div class="ruvor-stats">${vols}</div>`)}
    ${block("comportamento.bloco.queda", `<div class="ruvor-stats">${drawdown}</div>`)}
    ${block("comportamento.bloco.ibov", `<div class="ruvor-stats">${ibov}</div>`, m.benchmark_observations == null ? null : T("comportamento.nota.ibov", fInt.format(m.benchmark_observations)))}
    ${block("comportamento.bloco.proventos", `<div class="ruvor-stats">${divs}</div>`)}
    ${block("comportamento.bloco.distribuicao", hist, m.statistical_observations == null ? null : T("comportamento.nota.distribuicao", fInt.format(m.statistical_observations)), true)}
    ${block("comportamento.bloco.volume", `<div class="ruvor-stats">${vol}</div>`, null, true)}
  </div>`;
  if (m.statistical_observations != null) drawHistogram(m.histogram);
}

// Abrir e fechar: só o recolhível se redesenha (o histograma fica).
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-toggle]");
  if (!btn || !metric || btn.closest("#m23-states")) return;
  const name = btn.dataset.toggle;
  openState[name] = !openState[name];
  const hostM = $("[data-moments-host]");
  hostM.innerHTML = momentsHtml(metric);
  $("[data-toggle]", hostM).focus();
});

async function loadBehavior() {
  const host = $("#sec-behavior [data-body]");
  try {
    const r = await fetch(`/api/v1/assets/${TICKER}/metrics`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    metric = (await r.json()).metric;
  } catch {
    host.removeAttribute("aria-busy");
    host.innerHTML = `<div class="ruvor-callout ruvor-callout--critical" role="alert">${esc(T("ativo.erroSecao"))}</div>`;
    return;
  }
  renderBehavior();
  renderTextos();
}

// ---------------------------------------------------------------- os textos
function renderTextos() {
  $("#m23-textos-head").innerHTML = `<p><b>As 22 chaves <code>comportamento.*</code> do RF-04, nas duas leituras.</b> A iniciante é a de <code>textos.ts</code>, como está; a avançada é a proposta deste portão, com a mesma chave e os mesmos argumentos (RF-05). Cada afirmação da avançada copia a de <code>docs/mockups/M2.3/conferencia-comportamento.md</code>, onde está o <code>caminho:linha</code> que a confere; o que a conferência marca como não ancorado (o que o ajuste do Yahoo inclui, a natureza da data do provento, se o valor do provento é ajustado, a unidade do volume) não entra.</p>
    <p>Chave-função: uma linha por exemplo de <code>EXEMPLOS_AVANCADOS</code>, cobrindo os ramos da avançada; a coluna da iniciante mostra a iniciante com os mesmos argumentos. Chave de texto: uma linha.</p>
    <p>Rótulo novo do controle de recolher: <code>comportamento.momentos.abrir</code> = <q>${esc(TEXTOS["comportamento.momentos.abrir"])}</q> (o mesmo nos dois níveis e nos dois estados); alternativa neutra para o portão: <q>Assimetria e curtose</q>.</p>`;
  $("[data-ytd-note]").innerHTML = ytdNote();
  const rows = [];
  for (const k of Object.keys(TEXTOS_AVANCADOS)) {
    const av = TEXTOS_AVANCADOS[k], ini = TEXTOS[k];
    if (typeof av !== typeof ini || (typeof av === "function" && av.length !== ini.length)) throw new Error(`assinatura diverge: ${k}`);
    if (typeof av === "function") {
      const exs = EXEMPLOS_AVANCADOS[k];
      if (!exs) throw new Error(`sem exemplo: ${k}`);
      exs.forEach((a, i) => rows.push(`<tr><td>${esc(k)}</td><td>${esc((RAMO[k]?.[i] ? `${RAMO[k][i]}: ` : "") + JSON.stringify(a))}</td><td>${esc(ini(...a))}</td><td>${esc(av(...a))}</td></tr>`));
    } else {
      rows.push(`<tr><td>${esc(k)}</td><td>texto</td><td>${esc(ini)}</td><td>${esc(av)}</td></tr>`);
    }
  }
  if (Object.keys(TEXTOS_AVANCADOS).length !== 22) throw new Error("as chaves avançadas não são 22");
  $("#m23-textos-body").innerHTML = rows.join("");
}

// ---------------------------------------------------------------- o controle: os estados
function renderControle() {
  $("#m23-controle-note").innerHTML = `<p><b>O controle de recolher — nasce neste portão; a T9 (a tabela dos nove modelos, a trilha) e a T12 o repetem, e a T7 o leva ao kit.</b></p>
    <p>Derivado da linha expansível da tabela do kit (<code>.ruvor-table__toggle</code>, <code>brand/ruvor/components.css</code>): botão sem moldura, na cor de tinta, com a seta à esquerda que gira 90° quando <code>aria-expanded="true"</code>. O que acrescenta: a régua fina acima, que separa o controle do conteúdo anterior; 6 px de respiro acima e abaixo, para o alvo de toque; o sublinhado no hover, porque fora da tabela não há a linha inteira reagindo.</p>
    <p>O rótulo é um só nos dois estados (o <code>Collapsible</code> do plano recebe um <code>label</code>): aberto ou fechado é dito pela seta e pelo <code>aria-expanded</code>. O conteúdo fechado não é desenhado; o <code>aria-controls</code> aponta para o id que só existe aberto (escolha registrada no plano). O raiz leva <code>data-collapsible</code> e <code>data-open</code>. Padrão: fechado na iniciante, aberto na avançada; trocar a leitura reaplica o padrão; abrir não é lembrado.</p>
    <p><b>Rótulo, para o portão escolher:</b> <q>${esc(TEXTOS["comportamento.momentos.abrir"])}</q> (o proposto, com verbo, como o exemplo do RF-07) ou a alternativa neutra <q>Assimetria e curtose</q>, que lê igual aberto e fechado.</p>
    <p><b>Série curta, para a T7:</b> sem a distribuição (<code>statistical_observations</code> nulo), a frase <code>comportamento.histogramaCurto</code> fica no lugar do gráfico e o recolhível continua existindo, com a assimetria e a curtose nulas dentro (<q>—</q> e <code>comportamento.nulo.janela</code>), como em <code>BehaviorSection.tsx:316-350</code>; o ITUB4 não tem esse estado, e esta página o desenha pelo mesmo caminho. No IBOV, o beta e a correlação nulos usam <code>comportamento.nulo.referencia</code>.</p>
    <p>Os estados abaixo são forçados por classe de moldura (<code>is-hover</code>, <code>is-focus</code>), como na vitrine do kit; troque o tema na barra para ver os dois.</p>`;
  const label = TEXTOS["comportamento.momentos.abrir"];
  const sample = `<div class="ruvor-stats">${stat("skewness", "−1,44", TEXTOS["comportamento.skewness"]("−1,44", -1))}</div>`;
  const fig = (cap, html) => `<figure><figcaption>${esc(cap)}</figcaption>${html}</figure>`;
  const force = (html, cls) => html.replace('class="m23-collapsible__toggle"', `class="m23-collapsible__toggle ${cls}"`);
  $("#m23-states").innerHTML = [
    fig("fechado · repouso", collapsible("moments", label, "", false, "m23-s1")),
    fig("fechado · hover", force(collapsible("moments", label, "", false, "m23-s2"), "is-hover")),
    fig("fechado · foco do teclado", force(collapsible("moments", label, "", false, "m23-s3"), "is-focus")),
    fig("aberto", collapsible("moments", label, sample, true, "m23-s4")),
  ].join("");
}

// ---------------------------------------------------------------- tema, leitura e vista
const themeBtns = document.querySelectorAll("[data-set-theme]");
function setTheme(theme) {
  if (theme === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", theme);
  for (const b of themeBtns) b.setAttribute("aria-pressed", String(b.dataset.setTheme === theme));
  for (const make of charts.values()) make();
}
for (const b of themeBtns) b.addEventListener("click", () => setTheme(b.dataset.setTheme));
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { for (const make of charts.values()) make(); });

const readingBtns = document.querySelectorAll("[data-set-reading]");
function setReading(r) {
  reading = r;
  root.setAttribute("data-reading", r);
  for (const b of readingBtns) b.setAttribute("aria-pressed", String(b.dataset.setReading === r));
  // Trocar o nível reaplica o padrão de cada recolhível (RF-07): iniciante fecha, avançada abre.
  openState.moments = r === "advanced";
  if (metric) renderBehavior();
}
for (const b of readingBtns) b.addEventListener("click", () => setReading(b.dataset.setReading));

const viewBtns = document.querySelectorAll("[data-m23]");
function setView(view) {
  for (const b of viewBtns) b.setAttribute("aria-pressed", String(b.dataset.m23 === view));
  for (const v of document.querySelectorAll(".m23-view")) v.hidden = v.dataset.view !== view;
  if (view === "itub4") for (const make of charts.values()) make();
}
for (const b of viewBtns) b.addEventListener("click", () => setView(b.dataset.m23));

// ?vista=itub4|textos|controle&tema=light|dark|system&leitura=beginner|advanced&abrir=1 — para capturar cada vista direto.
const params = new URLSearchParams(location.search);
setTheme(params.get("tema") || "system");
setView(params.get("vista") || "itub4");
setReading(params.get("leitura") === "advanced" ? "advanced" : "beginner");
if (params.get("abrir") === "1") openState.moments = true;
renderControle();
await loadBehavior();
document.body.dataset.ready = "true";
</script>
</body>
</html>
