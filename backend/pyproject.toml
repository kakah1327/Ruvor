[project]
name = "ruvor-backend"
version = "0.1.0"
description = "Aplicacao web do Ruvor"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.18",
    "celery>=5.6",
    "redis>=8.1",
    "psycopg[binary]>=3.3",
]

[project.optional-dependencies]
dev = ["mypy>=2.3", "django-stubs>=6.1", "pytest>=9.1", "pytest-django>=4.14", "ruff==0.16.6", "celery-types==0.26.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Nao e pacote distribuivel. Declarar o pacote evita a descoberta automatica do
# setuptools, que falha com manage.py e config/ lado a lado.
[tool.setuptools]
packages = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["config", "apps", "manage.py", "tests"]
strict = true
plugins = ["mypy_django_plugin.main"]

# O plugin importa o modulo de settings. config.settings exige RUVOR_SECRET_KEY e
# derrubaria o mypy sem a variavel; settings_test a preenche.
[tool.django-stubs]
django_settings_module = "config.settings_test"

# O motor tem verificacao de tipos propria, com a configuracao dele. Reverifica-lo sob o
# `strict` do backend duplicaria o trabalho e reprovaria os dois modulos que a D-21 congela
# ate a Etapa 6. O `py.typed` do motor continua valendo: os tipos SAO usados para verificar
# o codigo do backend que o chama — o que se suprime e o erro DENTRO do motor.
[[tool.mypy.overrides]]
module = ["engine.*"]
ignore_errors = true

# `apps/risk/provider.py` monta um DataFrame, entao o backend passa a importar pandas — que
# nao publica `py.typed`. Sob `strict`, isso e `import-untyped` no arquivo do BACKEND, fora
# do alcance da isencao de `engine.*`. E a mesma pedra que o proprio motor ja contornou.
[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E501 fora de proposito: o formatador impoe o comprimento de linha, e a regra so
# sobraria para o que ele nao sabe quebrar -- comentario, docstring, texto.
select = ["E", "W", "F", "I", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# `dependencies` e `operations` sao formato canonico do Django em migration; anotar
# com ClassVar e editar artefato gerado, e o makemigrations --check do F4 reprovaria.
# A lista e fechada de proposito: "ALL" desligaria o lint num diretorio inteiro.
"**/migrations/*.py" = ["RUF012"]
