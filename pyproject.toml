[project]
name = "varlab"
version = "0.1.0"
description = "Plataforma de modelagem e backtesting de VaR com metodos tradicionais, GARCH e Machine Learning"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "click>=8.1",
]

# Grupos opcionais: instale so o que precisar para a etapa em que estiver.
# Ex.: `pip install -e ".[traditional]"` para a Etapa 1, sem precisar de tensorflow.
[project.optional-dependencies]
traditional = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "yfinance>=0.2",
]
garch = [
    "arch>=6.3",
    "statsmodels>=0.14",
]
ml = [
    "tensorflow>=2.16",
]
web = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "plotly>=5.20",
]
storage = [
    "sqlalchemy>=2.0",
]
dev = [
    "pytest>=8.0",
]
all = [
    "varlab[traditional,garch,ml,web,storage,dev]",
]

[project.scripts]
varlab = "varlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["varlab*"]
