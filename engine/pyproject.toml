[project]
name = "ruvor-engine"
version = "0.2.0"
description = "Motor de modelagem e backtesting de risco do Ruvor"
requires-python = ">=3.12"
dependencies = ["click>=8.1"]

[project.optional-dependencies]
traditional = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "yfinance>=0.2"]
garch = ["arch>=6.3", "statsmodels>=0.14"]
ml = ["tensorflow>=2.16"]
dev = ["pytest>=8.0", "mypy==2.3.1", "build>=1.2", "setuptools>=68", "ruff==0.16.6"]
all = ["ruvor-engine[traditional,garch,ml,dev]"]

[project.scripts]
ruvor = "engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = false
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tensorflow.*", "arch.*", "yfinance.*", "scipy.*", "pandas.*"]
ignore_missing_imports = true

# Divida de tipagem, a pagar depois da Etapa 6 — ate la a D-21 congela o motor
# e corrigir exigiria editar codigo que nao pode ser alterado (a D-46 abriu uma
# excecao pontual em _conditional, so para o ajuste que nao convergia).
#   _quantile_nn: best_config nasce None e e desempacotado; o mypy nao prova
#                 que o laco de busca sempre atribui.
#   _conditional: self.dist e str, e o arch exige Literal. O arch tem anotacoes
#                 inline, entao ignore_missing_imports nao silencia isso.
[[tool.mypy.overrides]]
module = ["engine.models.ml._quantile_nn", "engine.models.garch._conditional"]
ignore_errors = true

[tool.ruff]
line-length = 88
# Com E501 desligado sobram 42 linhas acima de 88 colunas -- comentario, docstring e
# texto, que o formatador nao quebra. Nao e defeito.

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "RUF"]
# UP042 trocaria `class ModelCategory(str, Enum)` por StrEnum, e a troca NAO e
# equivalente: str() e f-string diferem entre as duas no 3.12, e ModelCategory e
# comparado e formatado em todo o motor. Reavaliar depois da Etapa 6 -- D-44.
ignore = ["E501", "UP042"]
