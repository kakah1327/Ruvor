services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${RUVOR_DB_NAME:?defina no .env}
      POSTGRES_USER: ${RUVOR_DB_USER:?defina no .env}
      POSTGRES_PASSWORD: ${RUVOR_DB_PASSWORD:?defina no .env}
    ports:
      - "${RUVOR_PORT_POSTGRES:?defina no .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8
    ports:
      - "${RUVOR_PORT_REDIS:?defina no .env}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: { context: ., dockerfile: infra/backend.Dockerfile, target: web }
    image: ruvor-web
    hostname: web
    environment: &backend-env
      RUVOR_SECRET_KEY: ${RUVOR_SECRET_KEY:?defina no .env}
      RUVOR_DEBUG: ${RUVOR_DEBUG:-true}
      RUVOR_ALLOWED_HOSTS: ${RUVOR_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      RUVOR_DB_HOST: ${RUVOR_DB_HOST:-postgres}
      RUVOR_DB_PORT: ${RUVOR_DB_PORT:-5432}
      RUVOR_DB_NAME: ${RUVOR_DB_NAME:?defina no .env}
      RUVOR_DB_USER: ${RUVOR_DB_USER:?defina no .env}
      RUVOR_DB_PASSWORD: ${RUVOR_DB_PASSWORD:?defina no .env}
      RUVOR_REDIS_URL: ${RUVOR_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/repo/backend
    ports:
      - "${RUVOR_PORT_WEB:?defina no .env}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: infra/backend.Dockerfile, target: worker }
    image: ruvor-worker
    hostname: worker
    # concorrencia declarada (RF-12 do M1.5): 4 GB no conteiner, 1-2 GB por rede em treino
    command: celery -A config worker --loglevel=info --concurrency=2
    environment: *backend-env
    volumes:
      - ./backend:/repo/backend
      - ./engine:/repo/engine
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  beat:
    # reusa a imagem que o `worker` constroi: sem `build`, e `never` para o compose nao
    # tentar baixar `ruvor-worker` de registro publico -- falta a imagem, falha alto
    image: ruvor-worker
    pull_policy: never
    hostname: beat
    command: celery -A config beat --loglevel=info
    environment:
      <<: *backend-env
      RUVOR_BEAT_ASSETS_CRON: ${RUVOR_BEAT_ASSETS_CRON:-}
      RUVOR_BEAT_PRICES_CRON: ${RUVOR_BEAT_PRICES_CRON:-}
    volumes:
      - ./backend:/repo/backend
      # o Beat nao calcula, mas importa: a descoberta automatica chega em `engine`, e a
      # imagem so copia o pyproject.toml e o __init__.py do motor
      - ./engine:/repo/engine
    # Duas condicoes. (1) o laco vivo: o Scheduler regrava `celerybeat-schedule` a cada
    # sync, e medido na T7 do M1.5 com a agenda ociosa o mtime avanca a cada 300 s (o
    # max_interval do Beat); 600 s e a folga de 2x. "Existe" nao bastaria: o arquivo mora na
    # montagem e sobrevive a recriacao do conteiner. (2) o broker alcancavel -- sem o Redis,
    # o ensure_connection desiste em ~10 s, por isso o timeout de 20 s.
    # Forma CMD, sem shell e sem `$`: o criterio da T7 executa este mesmo argv, extraido do
    # `docker compose config`, com `docker compose exec`.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, time
          age = time.time() - os.stat("/repo/backend/celerybeat-schedule").st_mtime
          if age > 600:
              sys.exit(f"celerybeat-schedule sem sync ha {age:.0f} s")
          from config import celery_app
          celery_app.connection_for_write().ensure_connection(max_retries=1)
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build: { context: ., dockerfile: infra/frontend.Dockerfile }
    image: ruvor-frontend
    hostname: frontend
    environment:
      VITE_PROXY_TARGET: http://web:8000
    volumes:
      - ./frontend:/repo/frontend
      - ./brand/ruvor:/repo/brand/ruvor:ro
      - /repo/frontend/node_modules
    ports:
      - "${RUVOR_PORT_FRONTEND:?defina no .env}:5173"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      web: { condition: service_healthy }

volumes:
  pgdata:
